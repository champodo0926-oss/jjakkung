<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="icon" href="icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>브레인 러시</title>
<style>
@font-face{font-family:"Jua";src:url(fonts/jua.woff2) format("woff2");font-display:block}
@font-face{font-family:"Gowun Dodum";src:url(fonts/gowun.woff2) format("woff2");font-display:block}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
</style>
<script src="firebase-config.js"></script>
<script src="online.js"></script>
<script>window.APP_VERSION="1.0-web"</script>
</head><body>
<style>
/* Layout: one-screen app. Home = tab pages (플레이/오늘/랭킹/내 정보) over a fixed tab bar; game = versus strip, target, board, expression. Single dark look by choice. */
:root{
  --ink:#10132e; --panel:#1a1e48; --panel2:#232862; --line:#333a80;
  --fg:#eef0ff; --mute:#9aa0d6; --num:#ffd166; --op:#6ee7f9; --hot:#ff6b6b; --ok:#5ee6a0;
  --cellbg:#232862; --celldig:#ffffff; --cellop:#6ee7f9; --opbg:#171b40; --path:#ffd166; --pathtx:#2a1d00;
  --fd:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fb:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tabh:62px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--fb);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--fd);color:inherit;border:0;cursor:pointer;background:none;font-size:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--op);outline-offset:2px}
input{font-family:var(--fd);font-size:18px;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;text-align:center}
.scr{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;box-sizing:border-box}
#home{padding-bottom:calc(var(--tabh) + 10px)}
/* cosmetic number themes */
body.th-gold{--cellbg:#2b2346;--celldig:#ffd166;--cellop:#ffe9b0;--path:#ffb703;--pathtx:#2a1d00}
body.th-neon{--cellbg:#0d2a3a;--celldig:#7cf7ff;--cellop:#ff7ad9;--opbg:#0b1830;--path:#7cf7ff;--pathtx:#00222a}
body.th-cyber{--cellbg:#2a0f3a;--celldig:#ff4fd8;--cellop:#f7ff4f;--opbg:#1a0a26;--path:#f7ff4f;--pathtx:#251a00}
body.th-magic{--cellbg:#2a1846;--celldig:#e9d7ff;--cellop:#b8f2c8;--opbg:#1c1032;--path:#c9a7ff;--pathtx:#1d0d33}

/* HOME */
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--fd);font-weight:400;font-size:30px;margin:0;letter-spacing:.5px}
.brand h1 b{color:var(--num);font-weight:400}
.gear{width:38px;height:38px;border-radius:11px;background:var(--panel);display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.page{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1;padding-bottom:6px}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.prof.gold{border-color:var(--num)}
.lvbadge{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:var(--num);line-height:1}
.lvbadge small{display:block;font-size:10px;color:var(--mute);text-align:center}
.ttl{font-family:var(--fd);font-size:18px;display:flex;gap:8px;align-items:baseline;min-width:0}
.ttl span{font-family:var(--fb);font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpbar{height:8px;background:var(--ink);border-radius:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--num);border-radius:8px;transform-origin:left}
.xptx{grid-column:2;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.sec{font-family:var(--fd);font-size:13px;color:var(--mute);letter-spacing:1px;margin:4px 2px -2px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;flex:none}
.mode .tx{flex:1;min-width:0}
.mode .tx b{display:block;font-family:var(--fd);font-weight:400;font-size:19px}
.mode .tx span{font-family:var(--fb);font-size:13px;color:var(--mute)}
.mode .rt{font-size:13px;color:var(--num);font-family:var(--fd);text-align:right}
.ai-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;font-size:14px;line-height:1.25}
.ai small{display:block;font-family:var(--fb);font-size:10.5px;color:var(--mute)}
.ai.lock{opacity:.4}
.ai.won{border-color:var(--ok)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.box p{margin:0;line-height:1.5}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--mute)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--num)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.seg button{border-radius:9px;padding:8px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--fg)}
.lb{display:flex;flex-direction:column;gap:6px}
.lr{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:9px 12px;font-size:14.5px}
.lr.me{border:1px solid var(--num)}
.lr .k{font-family:var(--fd);color:var(--mute);text-align:center}
.lr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .nm small{color:var(--mute);margin-left:6px;font-size:12px}
.lr .v{font-family:var(--fd);color:var(--num);font-variant-numeric:tabular-nums}
.tier{display:flex;align-items:center;gap:12px}
.emb{width:54px;height:54px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1.25;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mute)}
.cal i.d{background:var(--op);color:#00222a;font-family:var(--fd)}
.cal i.t{outline:2px solid var(--num)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--panel);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mute)}
.stat b{display:block;font-family:var(--fd);font-weight:400;font-size:20px;color:var(--fg)}

/* GAME */
.top{display:flex;align-items:center;gap:8px;min-height:36px}
.top .back{width:36px;height:36px;border-radius:10px;background:var(--panel);font-size:18px}
.top .md{font-family:var(--fd);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hp{color:var(--hot);font-size:16px;letter-spacing:2px}
.top .sc{font-family:var(--fd);font-size:18px;color:var(--num);font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.side .nm{font-family:var(--fd);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.r{text-align:right}
.pips{display:flex;gap:4px}
.side.r .pips{justify-content:flex-end}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.pips i.me{background:var(--num);border-color:var(--num)}
.pips i.op{background:var(--hot);border-color:var(--hot)}
.vsx{font-family:var(--fd);color:var(--mute);font-size:13px}
.fuse{height:6px;background:var(--ink);border-radius:6px;overflow:hidden;grid-column:1/-1}
.fuse i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0)}
.fuse.fa i{background:var(--hot)}
.fuse.ft i{background:var(--op)}
.tgt{display:flex;align-items:center;justify-content:center;gap:14px}
.tgt .lbl{font-size:13px;color:var(--mute);font-family:var(--fd)}
.tgt .v{font-family:var(--fd);font-size:54px;line-height:1;color:var(--num);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.tgt .cb{font-family:var(--fd);font-size:14px;color:var(--ink);background:var(--op);border-radius:999px;padding:3px 10px;visibility:hidden}
.tgt .cb.on{visibility:visible}
.bwrap{position:relative;align-self:center;touch-action:none}
.board{display:grid;gap:6px;position:relative;z-index:1}
.cell{display:grid;place-items:center;font-family:var(--fd);border-radius:12px;position:relative}
.cell.n{background:var(--cellbg);color:var(--celldig)}
.cell.o{color:var(--cellop);background:var(--opbg);border-radius:50%;transform:scale(.72)}
.cell.on.n{background:var(--path);color:var(--pathtx)}
.cell.on.o{background:var(--path);color:var(--pathtx);transform:scale(.8)}
.cell.aip.n,.cell.aip.o{background:var(--hot);color:#2b0606}
.cell.tip{outline:3px solid var(--op);outline-offset:-3px}
.cell.win{animation:pop .42s ease-out 1}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.cell.o.win{animation:none}
svg.pl{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
svg.pl polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.expr{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.expr .e{font-family:var(--fd);font-size:20px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.expr .h{font-size:12.5px;color:var(--mute)}
.expr .bad{color:var(--hot)}
.ctl{display:flex;gap:8px;justify-content:center}
.btn{font-size:16px;background:var(--panel2);border-radius:12px;padding:10px 16px}
.btn.pri{background:var(--num);color:#2a1d00}
.btn.hot{background:var(--hot);color:#2b0606}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:40;font-family:var(--fd);font-size:30px;pointer-events:none;opacity:0;text-align:center;white-space:nowrap}
.toast.go{animation:tst 1.1s ease-out 1}
.toast small{display:block;font-size:16px;color:var(--fg)}
.toast.sm{font-size:18px;background:var(--panel2);padding:10px 16px;border-radius:12px;white-space:normal;max-width:80vw}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:rgba(8,10,30,.88);display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;width:100%;max-width:380px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.card h2{font-family:var(--fd);font-weight:400;font-size:26px;margin:0;text-align:center;text-wrap:balance}
.card p{margin:0;line-height:1.55;font-size:14.5px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.c{text-align:center}
.mut{color:var(--mute);font-size:13px}
.big{font-family:var(--fd);font-size:44px;text-align:center;color:var(--num);line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-family:var(--fd);font-weight:400;color:var(--num);text-align:right}
.demo{display:grid;grid-template-columns:repeat(5,34px);gap:4px;justify-content:center;margin:2px 0}
.demo span{height:34px;display:grid;place-items:center;font-family:var(--fd);font-size:18px;border-radius:9px;background:var(--panel2)}
.demo span.o{color:var(--op);background:transparent}
.demo span.on{background:var(--num);color:#2a1d00}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.thb{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.thb .sw{display:flex;gap:4px}
.thb .sw i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-size:14px}
.thb.sel{border-color:var(--num)}
.thb.lock{opacity:.45}
.thb small{font-family:var(--fb);font-size:11px;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:2px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px;text-align:left;width:100%}
.sr:last-child{border-bottom:0}
.sr .r{font-family:var(--fd);color:var(--num);font-size:14px}
.code{font-family:var(--fd);font-size:46px;letter-spacing:8px;text-align:center;color:var(--num)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<!-- HOME -->
<section class="scr" id="home">
  <div class="brand"><h1>브레인 <b>러시</b></h1><button class="gear" id="bSet" aria-label="설정"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg></button></div>

  <div class="page" id="pgPlay">
    <div class="prof" id="profBox">
      <div class="lvbadge" id="pLv">1<small>LV</small></div>
      <div class="ttl"><b id="pTitle" style="font-weight:400">계산 견습생</b><span id="pNick"></span></div>
      <div class="xpbar"><i id="pXp"></i></div>
      <div class="xptx"><span id="pXpT">0 / 120 XP</span><span id="pNext">다음 칭호 Lv 5</span></div>
    </div>
    <div class="sec">AI 대결 · 같은 문제, 먼저 찾으면 1점 · 5점 먼저</div>
    <div class="ai-row" id="aiRow"></div>
    <div class="sec">사람과 대결</div>
    <button class="mode" id="mRank"><span class="ic" style="background:var(--num);color:#2a1d00">R</span><span class="tx"><b>랭크전</b><span>실시간 1:1 · 3점 먼저 · 이기면 +25 RP</span></span><span class="rt" id="rankRt"></span></button>
    <button class="mode" id="mFriend"><span class="ic" style="background:var(--ok);color:#00261a">F</span><span class="tx"><b>친구 대결</b><span>방 번호로 가족·친구와 같은 문제 대결</span></span></button>
    <div class="sec">혼자 하기</div>
    <button class="mode" id="mInf"><span class="ic" style="background:var(--hot);color:#2b0606">∞</span><span class="tx"><b>무한 러시</b><span>하트 3개 · 판이 5×5 → 8×8로 커져요</span></span><span class="rt" id="infBest"></span></button>
  </div>

  <div class="page" id="pgDay" hidden>
    <div class="box"><p style="font-family:var(--fd);font-size:20px">오늘의 러시</p><p class="mut">모두 같은 10문제예요. 하루에 한 번 기록이 남아요.</p></div>
    <button class="btn pri wide" id="mDay">오늘의 러시 시작</button>
    <div class="stat"><div><b id="dStreak">0</b>연속</div><div><b id="dToday">-</b>오늘 점수</div><div><b id="dBest">0</b>최고 점수</div></div>
    <div class="sec">이번 달 출석</div>
    <div class="cal" id="dCal"></div>
    <button class="btn wide" id="dShare">오늘 점수 자랑하기</button>
  </div>

  <div class="page" id="pgRank" hidden>
    <div class="seg"><button id="rkS" class="on">이번 시즌</button><button id="rkR">랭크 점수</button></div>
    <div class="box tier" id="rkMe"></div>
    <div class="lb" id="rkList"></div>
  </div>

  <div class="page" id="pgMe" hidden>
    <div class="prof" id="meProf"></div>
    <div class="stat" id="meStat"></div>
    <div class="sec">꾸미기 · 승부에는 영향이 없어요</div>
    <div class="th-grid" id="meTheme"></div>
    <div class="sec">칭호</div>
    <div class="lb" id="meTitles"></div>
  </div>
</section>

<div class="tabs" id="tabs"><nav>
  <button class="tab on" data-t="Play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>플레이</button>
  <button class="tab" data-t="Day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>오늘</button>
  <button class="tab" data-t="Rank"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="5" height="8" rx="1.5"/><rect x="9.5" y="6" width="5" height="14" rx="1.5"/><rect x="16" y="9" width="5" height="11" rx="1.5"/></svg>랭킹</button>
  <button class="tab" data-t="Me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>내 정보</button>
</nav></div>

<!-- GAME -->
<section class="scr" id="game" hidden>
  <div class="top"><button class="back" id="gBack" aria-label="그만하기">‹</button><span class="md" id="gMode">AI 대결</span><span class="hp" id="gHp"></span><span class="sc" id="gSc">0</span></div>
  <div class="vs" id="vsBox">
    <div class="side"><span class="nm" id="meNm">나</span><div class="pips" id="pipMe"></div></div>
    <span class="vsx">VS</span>
    <div class="side r"><span class="nm" id="opNm">AI</span><div class="pips" id="pipOp"></div></div>
    <div class="fuse fa" id="fuse"><i id="fuseI"></i></div>
  </div>
  <div class="tgt"><span class="lbl">목표</span><span class="v" id="tgt">0</span><span class="cb" id="combo">콤보 x2</span></div>
  <div class="bwrap" id="bwrap"><div class="board" id="board"></div><svg class="pl" id="pl"></svg></div>
  <div class="expr" id="expr"></div>
  <div class="ctl"><button class="btn" id="bClear">지우기</button></div>
</section>

<div class="toast" id="toast"></div>
<div class="ov" id="ov" hidden><div class="card" id="ovc"></div></div>

<script>
'use strict';
const TEST_UNLOCK_ALL=false;
const VER=window.APP_VERSION||'web';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP=window.AndroidApp||null;
const ONLINE=()=>!!(window.claude&&window.claude.online);

/* ================= profile (one object, like 별잇기) ================= */
const KEY='brainrush.v1';

/* ================= sound: tone() from 별잇기 ================= */
let ac=null;
function tone(f,d=.09,type='triangle',vol=.1,delay=0){if(!P.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sTap=()=>tone(660,.05,'triangle',.06), sWin=()=>{tone(784,.1);tone(1046,.14,'triangle',.1,.08)}, sLose=()=>{tone(300,.16,'sawtooth',.05);tone(220,.2,'sawtooth',.05,.12)}, sBig=()=>{tone(660,.1);tone(880,.1,'triangle',.1,.1);tone(1320,.2,'triangle',.1,.2)};

function lvOf(xp){let lv=1;while(xp>=need(lv)){xp-=need(lv);lv++}return{lv,rest:xp,need:need(lv)}}
function titleOf(lv){let t=TITLES[0][1];for(const [l,n] of TITLES)if(lv>=l)t=n;return t}

function tierOf(rp){let k=0;TIERS.forEach((t,i)=>{if(rp>=t[1])k=i});return k}
function emblem(k,s=54){const c=TIERS[k][2];const pts=[];const n=k+3;for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,r=i%2?13:24;pts.push((27+r*Math.cos(a)).toFixed(1)+','+(29+r*Math.sin(a)).toFixed(1))}

function monthKey(){const t=new Date(Date.now()+9*3600e3);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')}
function todayKey(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function addXp(x){const mk=monthKey();if(P.ss.id!==mk)P.ss={id:mk,sc:0};P.ss.sc+=x;P.xp+=x}

/* ================= AI ================= */
const AIS=[
  {nm:'초보',bot:'꼬마봇',t:[20,32],tg:{min:2,lo:5,hi:45,n:5}},
  {nm:'보통',bot:'연필봇',t:[13,21],tg:{min:2,lo:8,hi:72,n:5}},
  {nm:'어려움',bot:'주판봇',t:[10,16],tg:{min:3,lo:10,hi:99,n:5}},
  {nm:'천재',bot:'알파봇',t:[7,12],tg:{min:3,lo:12,hi:150,n:6}},
  {nm:'마스터',bot:'제로봇',t:[4.5,8],tg:{min:3,lo:15,hi:200,n:6}},
];
const LIVE_TG={min:2,lo:8,hi:99,n:5};

/* ================= RNG + generator ================= */
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
function ap(a,op,b){switch(op){case'+':return a+b;case'−':return a-b;case'×':return a*b;case'÷':return(b&&a%b===0)?a/b:null}}
function nbr(n,i){const r=i/n|0,c=i%n,o=[];if(r)o.push(i-n);if(r<n-1)o.push(i+n);if(c)o.push(i-1);if(c<n-1)o.push(i+1);return o}
function genBoard(n){const cells=[];for(let i=0;i<n*n;i++){const r=i/n|0,c=i%n;if((r+c)%2===0)cells.push({t:'n',v:ri(1,9)});else{const x=rnd()*9;cells.push({t:'o',v:x<3?'+':x<5?'−':x<8?'×':'÷'})}}return{n,cells}}
function enumerate(B,maxNums){
  const n=B.n,C=B.cells,map=new Map(),vis=new Uint8Array(n*n),path=[];
  function dfs(i,val,k){
    if(k>=2){let e=map.get(val);if(!e)map.set(val,e={min:k,cnt:0,path:path.slice()});else if(k<e.min){e.min=k;e.path=path.slice()}e.cnt++}
    if(k>=maxNums)return;
    for(const o of nbr(n,i)){if(vis[o])continue;vis[o]=1;path.push(o);
      for(const m of nbr(n,o)){if(vis[m])continue;const nv=ap(val,C[o].v,C[m].v);if(nv===null||Math.abs(nv)>999)continue;vis[m]=1;path.push(m);dfs(m,nv,k+1);path.pop();vis[m]=0}
      path.pop();vis[o]=0}
  }
  for(let i=0;i<n*n;i++)if(C[i].t==='n'){vis[i]=1;path.push(i);dfs(i,C[i].v,1);path.pop();vis[i]=0}
  return map;
}
/* target always comes from a real path on the board, and needs at least `min` numbers */
function makePuzzle(o){
  for(let tries=0;tries<60;tries++){
    const B=genBoard(o.n),m=enumerate(B,4),cand=[];
    for(const [v,e] of m)if(v>=o.lo&&v<=o.hi&&e.min>=o.min&&e.min<=o.min+1)cand.push([v,e]);
    if(!cand.length)continue;
    cand.sort((a,b)=>a[0]-b[0]);
    const [v,e]=cand[Math.floor(rnd()*cand.length)];
    return{B,target:v,min:e.min,sol:e.path};
  }
  return makePuzzle(Object.assign({},o,{min:2,lo:2,hi:999}));
}
function tutPuzzle(){ /* fixed first board for the guided start */
  const nums=[4,3,2,6,5, 7,1,8,2,3, 9,4,1];const ops=['+','×','−','+','×','+','−','×','÷','+','×','+'];
  const n=5,cells=[];let a=0,b=0;for(let i=0;i<25;i++){const r=i/5|0,c=i%5;cells.push((r+c)%2===0?{t:'n',v:nums[a++]}:{t:'o',v:ops[b++]})}
  return{B:{n,cells},target:14,min:3,sol:[0,1,2,3,4]};
}

/* ================= game state ================= */
let G=null,path=[],drag=false,cs=56,gap=6;
const T={};
function clearT(){for(const k in T){clearTimeout(T[k]);delete T[k]}}
function setRnd(seed){rnd=seed==null?Math.random:mul(seed)}

function startTut(){setRnd(null);G={mode:'tut',score:0,combo:0,best:0,solved:0};begin(tutPuzzle(),0)}
function startVs(lv){setRnd(null);G={mode:'vs',lv,ai:AIS[lv],me:0,op:0,goal:5,score:0,combo:0,best:0,solved:0,freeze:0};nextPuzzle()}
function startInf(){setRnd(null);G={mode:'inf',hp:3,score:0,combo:0,best:0,solved:0,stage:0,revived:0};nextPuzzle()}
function startDay(){const d=todayKey();setRnd(hashStr('day'+d));G={mode:'day',score:0,combo:0,best:0,solved:0,stage:0,total:10,key:d};nextPuzzle()}

function soloParams(s){const n=s<6?5:s<13?6:s<21?7:8;const min=s<3?2:3;const hi=s<6?60:s<13?120:200;return{n,min,lo:s<3?5:10,hi}}
function soloLimit(s,n){return Math.max(16,38-s)+(n-5)*3}

function nextPuzzle(){
  let pz;
  if(G.mode==='vs')pz=makePuzzle(G.ai.tg);
  else if(G.mode==='live'){setRnd(hashStr(G.room+'#'+G.round));pz=makePuzzle(LIVE_TG)}
  else pz=makePuzzle(soloParams(G.stage));
  let dur;
  if(G.mode==='vs'){const [a,b]=G.ai.t;let sec=(a+Math.random()*(b-a))*(1+.22*(pz.min-2));if(G.freeze){sec+=3;G.freeze=0;T.fz=setTimeout(()=>toast('AI 얼림 +3초','var(--op)'),200)}dur=sec*1000}
  else if(G.mode==='live')dur=60000;
  else dur=soloLimit(G.stage,pz.B.n)*1000;
  begin(pz,dur);
}
function begin(pz,dur){
  clearT();path=[];G.pz=pz;G.live=true;G.dur=dur;G.wait=0;
  show('game');drawBoard();
  $('tgt').textContent=pz.target;
  renderHud();renderPath();
  const now=performance.now();G.end=now+dur;
  if(dur){runFuse(dur,dur);T.end=setTimeout(timeUp,dur)}else{const f=$('fuseI');f.style.transition='none';f.style.transform='scaleX(0)'}
  if(G.mode==='tut')tutHint();
}
function runFuse(left,total){
  const f=$('fuseI');
  f.style.transition='none';f.style.transform='scaleX('+(1-left/total)+')';
  f.getBoundingClientRect();
  f.style.transition='transform '+left+'ms linear';f.style.transform='scaleX(1)';
}
function freezeFuse(){const f=$('fuseI');const cur=getComputedStyle(f).transform;f.style.transition='none';f.style.transform=cur}

function timeUp(){
  if(!G||!G.live)return;
  if(G.mode==='live'){if(G.host)liveDecide('-');return}
  G.live=false;freezeFuse();G.combo=0;sLose();buzz(60);showOpPath(G.pz.sol);
  if(G.mode==='vs'){G.op++;toast(G.ai.bot+' 득점','var(--hot)')}
  else{if(G.mode==='inf')G.hp--;G.stage++;toast('시간 끝','var(--hot)')}
  renderHud();
  T.nx=setTimeout(afterRound,1500);
}
function afterRound(){
  if(!G)return;
  if(G.mode==='vs'){if(G.me>=G.goal)return finish(true);if(G.op>=G.goal)return finish(false)}
  if(G.mode==='inf'&&G.hp<=0)return offerRevive();
  if(G.mode==='day'&&G.stage>=G.total)return finish(true);
  if(G.mode==='live')return;
  nextPuzzle();
}
function solved(){
  G.live=false;clearT();freezeFuse();
  const now=performance.now(),frac=G.dur?Math.max(0,(G.end-now)/G.dur):1;
  const nums=(path.length+1)/2;
  G.combo++;G.best=Math.max(G.best,G.combo);G.solved++;
  const mult=Math.min(3,1+.2*(G.combo-1));
  const pts=Math.round((100+40*(nums-2))*(.5+.5*frac)*mult);
  G.score+=pts;
  sWin();buzz(20);
  for(const i of path){const el=$('board').children[i];el.classList.remove('win');void el.offsetWidth;el.classList.add('win')}
  if(G.mode==='tut'){renderHud();T.nx=setTimeout(tutDone,900);return}
  if(G.mode==='live'){G.myPts=pts;if(G.host)liveDecide('H');else{G.wait=1;liveClaim()}renderHud();return}
  toast('+'+pts,'var(--num)',G.combo>1?'콤보 x'+G.combo:'');
  if(G.mode==='vs'){G.me++;if(G.combo%3===0)G.freeze=1}else G.stage++;
  renderHud();
  T.nx=setTimeout(afterRound,1000);
}

/* ================= board ================= */
function drawBoard(){
  const B=G.pz.B,n=B.n,b=$('board');
  const W=Math.min(document.documentElement.clientWidth-32,428);
  const H=window.innerHeight-330;
  gap=n>6?4:6;
  cs=Math.floor(Math.min((W-gap*(n-1))/n,(H-gap*(n-1))/n,72));cs=Math.max(cs,30);
  b.style.gridTemplateColumns='repeat('+n+','+cs+'px)';
  b.innerHTML='';
  B.cells.forEach((c,i)=>{const d=document.createElement('div');d.className='cell '+c.t;d.dataset.i=i;d.style.height=cs+'px';d.style.fontSize=(c.t==='n'?cs*.5:cs*.55)+'px';d.textContent=c.v;b.appendChild(d)});
  const sz=n*cs+(n-1)*gap;const svg=$('pl');svg.setAttribute('viewBox','0 0 '+sz+' '+sz);svg.style.width=sz+'px';svg.style.height=sz+'px';
}
function ctr(i){const n=G.pz.B.n,r=i/n|0,c=i%n;return[(c*(cs+gap)+cs/2).toFixed(1),(r*(cs+gap)+cs/2).toFixed(1)]}
function evalPath(p){const C=G.pz.B.cells;let v=C[p[0]].v;for(let k=1;k+1<p.length;k+=2){v=ap(v,C[p[k]].v,C[p[k+1]].v);if(v===null)return null}return v}
function line(p,col){return '<polyline stroke="'+col+'" stroke-opacity=".6" stroke-width="'+Math.max(4,cs*.16)+'" points="'+p.map(i=>ctr(i).join(',')).join(' ')+'"/>'}
function renderPath(){
  const C=G.pz.B.cells,kids=$('board').children;
  for(const el of kids)el.classList.remove('on','aip');
  for(const i of path)kids[i].classList.add('on');
  $('pl').innerHTML=path.length>1?line(path,'var(--path)'):'';
  const ex=$('expr');
  if(G.wait){ex.innerHTML='<span class="e">확인 중…</span><span class="h">누가 먼저였는지 보고 있어요</span>';return}
  if(!path.length){ex.innerHTML='<span class="e">&nbsp;</span><span class="h">숫자에서 시작해 옆 칸으로 이어 그리세요 · 앞에서부터 차례로 계산</span>';return}
  const toks=path.map(i=>C[i].v).join(' ');
  const end=C[path[path.length-1]].t==='n';
  const v=end?evalPath(path):evalPath(path.slice(0,-1));
  let h;
  if(v===null)h='<span class="h bad">÷는 나누어떨어질 때만 돼요</span>';
  else if(!end)h='<span class="h">다음 숫자로 이어 주세요</span>';
  else h='<span class="h">지금 값 <b style="color:var(--fg)">'+v+'</b> · 목표 '+G.pz.target+'</span>';
  ex.innerHTML='<span class="e">'+toks+(end&&v!==null?' = '+v:'')+'</span>'+h;
}
function showOpPath(p,label){path=[];G.wait=0;renderPath();const kids=$('board').children;for(const i of p)kids[i].classList.add('aip');
  $('pl').innerHTML=line(p,'var(--hot)');
  const C=G.pz.B.cells;$('expr').innerHTML='<span class="e" style="color:var(--hot)">'+p.map(i=>C[i].v).join(' ')+' = '+G.pz.target+'</span><span class="h">'+(label||'이렇게 만들 수 있었어요')+'</span>'}
function check(){
  if(!G.live||path.length<3)return;
  const C=G.pz.B.cells;if(C[path[path.length-1]].t!=='n')return;
  if(evalPath(path)===G.pz.target)solved();
}
function cellAt(x,y){const el=document.elementFromPoint(x,y);if(!el||!el.classList.contains('cell'))return -1;
  const r=el.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),lim=cs*.42;
  if(Math.abs(dx)>lim||Math.abs(dy)>lim)return -1;return +el.dataset.i}
function adj(a,b){return nbr(G.pz.B.n,a).includes(b)}
function down(e){
  if(!G||!G.live)return;const i=cellAt(e.clientX,e.clientY);if(i<0)return;
  const C=G.pz.B.cells,last=path[path.length-1];
  if(!path.length){if(C[i].t!=='n')return;path=[i]}
  else if(i===last){path.length=Math.max(0,path.length-(C[i].t==='n'?2:1));if(path.length===0&&C[i].t==='n')path=[i];drag=true;sTap();renderPath();return}
  else if(path.includes(i))path=path.slice(0,path.indexOf(i)+1);
  else if(adj(last,i))path.push(i);
  else if(C[i].t==='n'&&C[last].t==='n'){const common=nbr(G.pz.B.n,last).filter(o=>!path.includes(o)&&adj(o,i));if(common.length===1)path.push(common[0],i);else path=[i]}
  else if(C[i].t==='n')path=[i];
  else return;
  drag=true;sTap();
  try{$('bwrap').setPointerCapture(e.pointerId)}catch(_){}
  renderPath();check();
}
function move(e){
  if(!drag||!G||!G.live||!path.length)return;const i=cellAt(e.clientX,e.clientY);if(i<0)return;
  const last=path[path.length-1];if(i===last)return;
  if(i===path[path.length-2]){path.pop();renderPath();return}
  if(!path.includes(i)&&adj(last,i)){path.push(i);if(G.pz.B.cells[i].t==='n')sTap();renderPath();check()}
}
function up(){drag=false}
$('bwrap').addEventListener('pointerdown',down);
$('bwrap').addEventListener('pointermove',move);
$('bwrap').addEventListener('pointerup',up);
$('bwrap').addEventListener('pointercancel',up);
$('bClear').onclick=()=>{if(G&&G.live){path=[];renderPath()}};

/* ================= HUD ================= */
function renderHud(){
  const m=G.mode,vs=m==='vs'||m==='live';
  $('gMode').textContent=m==='vs'?'AI 대결 · '+G.ai.nm:m==='live'?(G.ranked?'랭크전':'친구 대결'):m==='inf'?'무한 러시 · '+(G.stage+1)+'번째':m==='day'?'오늘의 러시 · '+Math.min(G.stage+1,10)+'/10':'첫 문제';
  $('gHp').textContent=m==='inf'?'♥'.repeat(Math.max(0,G.hp))+'♡'.repeat(Math.max(0,3-G.hp)):'';
  $('gSc').textContent=G.score;
  $('vsBox').querySelectorAll('.side,.vsx').forEach(x=>x.hidden=!vs);
  $('vsBox').hidden=m==='tut';
  $('fuse').className='fuse '+(m==='vs'?'fa':'ft');
  if(vs){const goal=G.goal;$('meNm').textContent=P.nick;$('opNm').textContent=m==='vs'?G.ai.bot:(G.opNick||'상대');
    $('pipMe').innerHTML=Array.from({length:goal},(_,k)=>'<i class="'+(k<G.me?'me':'')+'"></i>').join('');
    $('pipOp').innerHTML=Array.from({length:goal},(_,k)=>'<i class="'+(k<G.op?'op':'')+'"></i>').join('')}
  const cb=$('combo');cb.textContent='콤보 x'+G.combo;cb.classList.toggle('on',G.combo>1);
}
function toast(t,col,sub,sm){const el=$('toast');el.className='toast'+(sm?' sm':'');el.innerHTML=t+(sub?'<small>'+sub+'</small>':'');el.style.color=col;void el.offsetWidth;el.classList.add('go')}
function note(t){toast(t,'var(--fg)','',1)}

  $('expr').innerHTML='<span class="e">4 + 3 × 2 = 14</span><span class="h">빛나는 4에서 시작해 + 3 → × 2 로 이어 그려 보세요</span>'}

/* ================= finish + XP ================= */
function offerRevive(){
  if(G.revived){return finish(false)}
  G.revived=1;
  const free=adsRemoved();
  modal('<h2>하트가 다 떨어졌어요</h2><p class="c">'+(free?'광고 제거 혜택으로 한 번 이어 할 수 있어요.':'짧은 광고를 보면 하트 1개로 이어 할 수 있어요.')+'</p><div class="row"><button class="btn pri" id="rvGo">'+(free?'이어 하기':'광고 보고 이어 하기')+'</button><button class="btn" id="rvNo">그만하기</button></div>');
  $('rvNo').onclick=()=>{closeModal();finish(false)};
  $('rvGo').onclick=()=>{if(free){closeModal();G.hp=1;nextPuzzle();return}

}
function finish(win){
  clearT();G.live=false;G.done=1;
  const before=lvOf(P.xp);
  let xp=Math.round(G.score/10);let head,lines=[],extraBtn='';
  P.games++;P.solved+=G.solved;
  if(G.mode==='vs'){
    if(win){xp+=40+G.lv*20;P.wins++;if(P.beaten<G.lv+1)P.beaten=G.lv+1}
    head=win?'승리!':'아쉬워요';
    lines=[['점수',G.score],['맞힌 문제',G.me+' : '+G.op],['최고 콤보',G.best]];
    if(win&&G.lv<4)extraBtn='<button class="btn pri" id="rNext">다음 AI: '+AIS[G.lv+1].nm+'</button>';
  }else if(G.mode==='inf'){
    const nb=G.score>P.best;if(nb)P.best=G.score;
    head=nb?'새 기록!':'러시 끝';
    lines=[['점수',G.score],['버틴 문제',G.solved],['최고 콤보',G.best],['내 최고',P.best]];
  }else if(G.mode==='day'){
    const prev=P.day[G.key]||0,first=!P.day[G.key];if(G.score>prev)P.day[G.key]=Math.max(G.score,1);
    if(first){const y=new Date();y.setDate(y.getDate()-1);const yk=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      P.streak={last:G.key,n:P.streak.last===yk?P.streak.n+1:1};xp+=30}
    head='오늘의 러시 완료';
    lines=[['점수',G.score],['맞힌 문제',G.solved+' / 10'],['최고 콤보',G.best],['연속 출석',P.streak.n+'일']];
  }else if(G.mode==='live'){
    head=win?'승리!':'아쉬워요';P.wins+=win?1:0;
    lines=[['맞힌 문제',G.me+' : '+G.op],['점수',G.score]];
    if(G.ranked){const d=win?25:-15,old=P.rp;P.rp=Math.max(0,P.rp+d);lines.push(['랭크 점수',(d>0?'+':'')+(P.rp-old)+' → '+P.rp]);
      const k0=tierOf(old),k1=tierOf(P.rp);if(k1>k0)lines.push(['승급',TIERS[k1][0]]);xp+=win?40:10}
    else xp+=win?30:10;
    if(G.forfeit)lines.push(['','상대가 나갔어요']);
  }
  addXp(xp);save();syncOnline();notiSync();
  const after=lvOf(P.xp);
  let extra='';
  if(after.lv>before.lv){sBig();extra='<p class="c" style="color:var(--num);font-family:var(--fd);font-size:18px">레벨 업! Lv '+after.lv+'</p>';
    if(titleOf(after.lv)!==titleOf(before.lv))extra+='<p class="c">새 칭호 <b style="color:var(--num)">'+titleOf(after.lv)+'</b></p>';
    for(const [id,nm,l] of THEMES)if(l>before.lv&&l<=after.lv)extra+='<p class="c">숫자 테마 <b>'+nm+'</b> 열림</p>'}
  else win?sWin():sLose();
  const again=G.mode==='live'?'':'<button class="btn '+(extraBtn?'':'pri')+'" id="rAgain">'+(G.mode==='vs'?'다시 하기':G.mode==='day'?'한 번 더 (기록은 최고만)':'한 번 더')+'</button>';
  const share=G.mode==='day'?'<button class="btn" id="rShare">점수 자랑하기</button>':'';
  modal('<h2>'+head+'</h2><div class="big">'+G.score+'</div><div class="kv">'+lines.map(([k,v])=>'<span>'+k+'</span><b>'+v+'</b>').join('')+'<span>얻은 경험치</span><b>+'+xp+' XP</b></div>'+extra+
    '<div class="row">'+extraBtn+again+share+'<button class="btn" id="rHome">홈으로</button></div>');
  const m=G.mode,lv=G.lv;
  const go=fn=>()=>{closeModal();maybeInter(m,fn)};
  if($('rAgain'))$('rAgain').onclick=go(()=>m==='vs'?startVs(lv):m==='inf'?startInf():startDay());
  if($('rNext'))$('rNext').onclick=go(()=>startVs(lv+1));
  if($('rShare'))$('rShare').onclick=shareDay;
  $('rHome').onclick=go(goHome);
}

/* ---- live match (ranked + friend). Host decides every round, guest claims. ---- */
let ROOM=null,mmTimer=null,mmDoc=null;
async function joinRoom(code,host,ranked,opNick){
  const R=await (await claude.use('room')).join(code);ROOM=R;
  G={mode:'live',room:code,host,ranked,round:0,me:0,op:0,goal:3,score:0,combo:0,best:0,solved:0,res:'',opNick:opNick||'',started:0};
  R.presence({n:P.nick.slice(0,12),rp:P.rp,host:host?1:0,res:'',claim:-1});
  R.onPeers(onPeers);onPeers();
}
function opPeer(){if(!ROOM)return null;return ROOM.peers().find(p=>!p.sameTab)||null}
function onPeers(){
  if(!G||G.mode!=='live'||G.done)return;
  const op=opPeer();
  if(!op){if(G.started&&!T.gone)T.gone=setTimeout(()=>{if(G&&G.mode==='live'&&!G.done&&!opPeer()){G.forfeit=1;liveEnd(true)}},8000);return}
  if(T.gone){clearTimeout(T.gone);delete T.gone}
  const pr=op.presence||{};if(pr.n)G.opNick=pr.n;
  if(!G.started){G.started=1;closeModal();modal('<h2>상대를 찾았어요</h2><p class="c" style="font-family:var(--fd);font-size:20px">'+esc(P.nick)+' <span class="mut">VS</span> '+esc(G.opNick)+'</p><p class="c mut">3점 먼저 내면 이겨요</p>');sBig();
    T.st=setTimeout(()=>{closeModal();G.round=0;nextPuzzle()},1600);return}
  if(G.host){if(pr.claim===G.res.length&&G.live!==undefined)liveDecide('G')}
  else{const r=pr.res||'';if(r.length>G.res.length)liveApply(r)}
}
function liveClaim(){ROOM&&ROOM.presence({claim:G.round})}
function liveDecide(who){
  if(!G.host||G.res.length!==G.round)return;
  G.res+=who;ROOM.presence({res:G.res});liveApply(G.res);
}
function liveApply(res){
  if(G.applied===res.length)return;G.applied=res.length;
  const w=res[G.round];if(!w)return;
  const mine=(w==='H')===G.host&&w!=='-';
  clearT();freezeFuse();G.live=false;G.wait=0;
  G.res=res;
  if(w==='-'){toast('둘 다 못 찾았어요','var(--fg)');showOpPath(G.pz.sol)}
  else if(mine){G.me++;toast('+1점','var(--num)',G.myPts?'+'+G.myPts:'');renderPath()}
  else{G.op++;G.combo=0;if(G.myPts)G.score-=G.myPts;sLose();buzz(60);toast(esc(G.opNick||'상대')+' 득점','var(--hot)');showOpPath(G.pz.sol,'상대가 먼저 찾았어요 · 이런 길도 있어요')}
  G.myPts=0;renderHud();
  T.nx=setTimeout(()=>{if(!G||G.done)return;if(G.me>=G.goal)return liveEnd(true);if(G.op>=G.goal)return liveEnd(false);G.round=G.res.length;nextPuzzle()},1500);
}
function liveEnd(win){leaveRoom();finish(win)}
function leaveRoom(){if(ROOM){try{ROOM.leave()}catch(e){}ROOM=null}}
async function startRanked(){
  if(!(await needOnline()))return;
  modal('<h2>상대 찾는 중</h2><p class="c">비슷한 랭크 점수의 상대를 찾고 있어요.</p><p class="c mut" id="mmT">0초</p><div class="row"><button class="btn" id="mmX">그만 찾기</button></div>');
  $('mmX').onclick=()=>{mmStop();closeModal()};
  const at=Date.now();mmDoc=DB.doc('mm/'+ME);
  try{await mmDoc.set({n:P.nick.slice(0,12),at,rp:P.rp});mmDoc.dropOnDisconnect&&mmDoc.dropOnDisconnect()}catch(e){closeModal();note('연결이 안 돼요. 잠시 후 다시 해 주세요');return}
  let done=false;
  const stopWatch=mmDoc.watch(d=>{if(done||!d||!d.room)return;done=true;mmStop(true);closeModal();joinRoom(d.room,false,true)});
  let sec=0;
  const tick=async()=>{
    if(done)return;sec+=3;if($('mmT'))$('mmT').textContent=sec+'초';
    if(sec>=45){mmStop();modal('<h2>지금은 상대가 없어요</h2><p class="c">잠시 후 다시 해 보거나, AI와 연습해요.</p><div class="row"><button class="btn pri" id="mmA">AI와 연습</button><button class="btn" id="mmB">닫기</button></div>');$('mmA').onclick=()=>{closeModal();startVs(Math.min(P.beaten,4))};$('mmB').onclick=closeModal;return}
    try{const q=await DB.collection('mm').oldest('at',20).get();
      const allow=150+sec*10;
      for(const d of q.docs){if(d.id===ME)continue;const v=d.data()||{};if(v.room||Date.now()-v.at>90000||Math.abs((v.rp||0)-P.rp)>allow)continue;
        const room='B'+Math.floor(100000+Math.random()*900000);
        const r=await DB.doc('mm/'+d.id).tx(f=>f&&!f.room?Object.assign({},f,{room}):undefined);
        if(r&&r.committed){done=true;mmStop();closeModal();joinRoom(room,true,true,v.n);return}}
    }catch(e){}
    mmTimer=setTimeout(tick,3000);
  };
  mmTimer=setTimeout(tick,1500);
  mmStop._w=stopWatch;
}
function mmStop(keep){clearTimeout(mmTimer);mmTimer=null;try{mmStop._w&&mmStop._w()}catch(e){}mmStop._w=null;if(mmDoc){try{mmDoc.remove()}catch(e){}mmDoc=null}}

  $('meTheme').innerHTML=THEMES.map(([id,nm,l])=>{const s=sw[id],open=UNLOCK()||lv>=l||(id==='gold'&&adsRemoved());return'<button class="thb'+(P.theme===id?' sel':'')+(open?'':' lock')+'" data-id="'+id+'" data-open="'+(open?1:0)+'" data-l="'+l+'"><span class="sw"><i style="background:'+s[0]+';color:'+s[1]+'">7</i><i style="color:'+s[2]+'">×</i><i style="background:'+s[0]+';color:'+s[1]+'">3</i></span>'+nm+'<small>'+(open?(P.theme===id?'사용 중':'사용하기'):'Lv '+l+'에 열림')+'</small></button>'}).join('');
  $('meTheme').querySelectorAll('.thb').forEach(b=>b.onclick=()=>{if(b.dataset.open!=='1'){note('Lv '+b.dataset.l+'에 열려요');return}P.theme=b.dataset.id;save();applyTheme();renderMe()});
  $('meTitles').innerHTML=TITLES.map(([l,n])=>'<div class="lr'+(lv>=l?' me':'')+'"><span class="k">'+l+'</span><span class="nm">'+n+'</span><span class="v">'+(lv>=l?'획득':'Lv '+l)+'</span></div>').join('');
}
$('mInf').onclick=startInf;$('mDay').onclick=startDay;$('dShare').onclick=shareDay;
$('mRank').onclick=startRanked;$('mFriend').onclick=startFriend;

/* ================= settings ================= */
$('bSet').onclick=settings;
function settings(){
  const nOn=P.noti;
  modal('<h2>설정</h2><div class="set">'+
   '<button class="sr" id="sNick"><span>닉네임</span><span class="r">'+esc(P.nick)+'</span></button>'+
   '<button class="sr" id="sSnd"><span>효과음</span><span class="r">'+(P.snd?'켬':'끔')+'</span></button>'+
   '<button class="sr" id="sVib"><span>진동</span><span class="r">'+(P.vib?'켬':'끔')+'</span></button>'+
   (APP&&APP.setNotif?'<button class="sr" id="sNoti"><span>하루 한 번 알림 (저녁 7시 30분)</span><span class="r">'+(nOn?'켬':'끔')+'</span></button>':'')+
   '<button class="sr" id="sAds"><span>광고 제거 · 골드 테마 포함</span><span class="r">'+(adsRemoved()?'적용됨':billPrice)+'</span></button>'+
   (APP?'<button class="sr" id="sRestore"><span>구매 복원</span><span class="r">›</span></button>':'')+
   '<button class="sr" id="sRules"><span>규칙 다시 보기</span><span class="r">›</span></button>'+
   '<button class="sr" id="sWipe"><span>내 기록 지우기</span><span class="r">›</span></button>'+
   (TEST_UNLOCK_ALL?'':'<button class="sr" id="sUnlock"><span>시험용 모두 열기</span><span class="r">'+(P.unlock?'켬':'끔')+'</span></button>')+
   '<a class="sr" style="color:inherit;text-decoration:none" href="https://github.com/champodo0926-oss/jjakkung/blob/main/PRIVACY.md" target="_blank" rel="noopener"><span>개인정보 처리방침</span><span class="r">›</span></a>'+
   '<div class="sr"><span class="mut">버전 '+esc(VER)+' · 짝꿍게임즈</span></div></div><button class="btn pri wide" id="sOk">닫기</button>');
  $('sOk').onclick=closeModal;
  $('sNick').onclick=nickEdit;
  $('sSnd').onclick=()=>{P.snd=P.snd?0:1;save();settings()};
  $('sVib').onclick=()=>{P.vib=P.vib?0:1;save();settings()};
  if($('sNoti'))$('sNoti').onclick=()=>{P.noti=P.noti?0:1;save();if(P.noti)askNotif();notiSync();settings()};
  $('sAds').onclick=()=>{if(adsRemoved())return;if(APP&&APP.buyRemoveAds){try{APP.buyRemoveAds()}catch(e){}}else note('앱에서 살 수 있어요')};
  if($('sRestore'))$('sRestore').onclick=()=>{try{APP.restorePurchases()}catch(e){}};
  $('sRules').onclick=rules;
  if($('sUnlock'))$('sUnlock').onclick=()=>{P.unlock=P.unlock?0:1;save();settings()};
  $('sWipe').onclick=()=>{modal('<h2>기록을 모두 지울까요?</h2><p class="c">레벨, 칭호, 점수, 출석이 모두 사라지고 되돌릴 수 없어요. 광고 제거 구매는 남아요.</p><div class="row"><button class="btn hot" id="wY">지우기</button><button class="btn" id="wN">취소</button></div>');
    $('wN').onclick=settings;$('wY').onclick=async()=>{const keep={adsOff:P.adsOff,snd:P.snd,vib:P.vib,seen:1};try{localStorage.removeItem(KEY)}catch(e){}
      if(await net()){try{await DB.doc('players/'+ME).remove()}catch(e){}try{await DB.doc('seasons/'+monthKey()+'/p/'+ME).remove()}catch(e){}}
      P=Object.assign({xp:0,beaten:0,best:0,day:{},theme:'base',unlock:0,nick:'',rp:0,games:0,wins:0,solved:0,ss:{id:'',sc:0},streak:{last:'',n:0},noti:0,notiAsk:0,results:0},keep);P.nick='러셔'+String(1000+Math.floor(Math.random()*9000));save();applyTheme();closeModal();goHome();note('기록을 지웠어요')}};
}
function nickEdit(){
  modal('<h2>닉네임</h2><input id="nIn" maxlength="10" value="'+esc(P.nick)+'"><p class="c mut">순위표와 대결에서 보여요 (10자까지)</p><div class="row"><button class="btn pri" id="nOk">저장</button><button class="btn" id="nNo">취소</button></div>');
  $('nNo').onclick=settings;$('nOk').onclick=()=>{const v=$('nIn').value.replace(/[<>]/g,'').trim().slice(0,10);if(!v){note('한 글자 이상 넣어 주세요');return}P.nick=v;save();syncOnline();settings()};
}
function rules(){
  modal('<h2>이렇게 해요</h2>'+
  '<p>판에는 <b style="color:var(--num)">숫자</b>와 <b style="color:var(--op)">연산</b> 칸이 번갈아 있어요. 숫자에서 시작해 <b>옆 칸(위·아래·왼쪽·오른쪽)</b>으로 이어 그려 <b style="color:var(--num)">목표 숫자</b>를 만드세요.</p>'+
  '<div class="demo"><span class="on">4</span><span class="o on">+</span><span class="on">3</span><span class="o on">×</span><span class="on">2</span></div>'+
  '<p class="c" style="font-family:var(--fd);font-size:18px">4 + 3 = 7 → 7 × 2 = <span style="color:var(--num)">14</span></p>'+
  '<p>계산은 <b>앞에서부터 차례로</b> 해요 (계산기처럼). ÷는 나누어떨어질 때만 돼요. 한 칸은 한 번만 지나가요.</p>'+
  '<p>끌어서 그려도 되고 톡톡 눌러도 돼요. 마지막 칸을 다시 누르면 한 칸 지워져요. 목표가 되는 순간 바로 정답!</p>'+
  '<p class="mut">목표는 늘 판 위에서 실제로 만들 수 있는 숫자예요. 빨리, 길게, 연속으로(콤보) 맞힐수록 점수가 커요. AI 대결에서 3연속 콤보면 AI가 3초 얼어요.</p>'+
  '<div class="row"><button class="btn pri" id="rOk">알겠어요</button></div>');

}

/* ================= notifications (Notif.java from 별잇기) ================= */
function askNotif(){try{if(APP&&APP.notifPermission&&APP.notifPermission()!=='granted')APP.askNotif()}catch(e){}}
window.__notifPerm=ok=>{if(!ok){P.noti=0;save()}notiSync()};
function notiSync(){if(!APP||!APP.setNotif)return;try{APP.setNotif(JSON.stringify({on:!!P.noti,done:Object.keys(P.day).sort().pop()||'',streak:P.streak.n}))}catch(e){}}
function maybeAskNoti(){if(!APP||!APP.setNotif||P.notiAsk||P.games<3)return;P.notiAsk=1;save();
  modal('<h2>하루 한 번 알려 드릴까요?</h2><p class="c">저녁 7시 30분에 오늘의 러시가 나왔다고, 연속 출석이 끊기기 전에 한 번만 알려 드려요.</p><div class="row"><button class="btn pri" id="naY">좋아요</button><button class="btn" id="naN">괜찮아요</button></div>');
  $('naY').onclick=()=>{P.noti=1;save();askNotif();notiSync();closeModal()};$('naN').onclick=closeModal}

/* ================= back button + pause ================= */
$('gBack').onclick=askQuit;
function askQuit(){
  if(!G||G.done)return goHome();
  if(G.mode==='live'){modal('<h2>대결에서 나갈까요?</h2><p class="c">'+(G.ranked?'랭크전에서 나가면 진 걸로 쳐요.':'친구에게 내가 나갔다고 보여요.')+'</p><div class="row"><button class="btn pri" id="qNo">계속하기</button><button class="btn" id="qYes">나가기</button></div>');
    $('qNo').onclick=closeModal;$('qYes').onclick=()=>{closeModal();if(G.ranked&&G.started){leaveRoom();G.op=G.goal;finish(false)}else goHome()};return}
  const was=G.live;if(was)G.left=Math.max(0,G.end-performance.now());G.live=false;G.held=1;clearT();freezeFuse();
  modal('<h2>그만할까요?</h2><p class="c">이번 판 기록은 남지 않아요.</p><div class="row"><button class="btn pri" id="qNo">계속하기</button><button class="btn" id="qYes">그만하기</button></div>');
  $('qYes').onclick=()=>{closeModal();goHome()};
  $('qNo').onclick=()=>{closeModal();G.held=0;resume(was)};
}
function resume(was){if(!G)return;if(!was){afterRound();return}
  G.live=true;const left=G.left!=null?G.left:Math.max(0,G.end-performance.now());G.left=null;G.end=performance.now()+left;
  if(G.dur){runFuse(left,G.dur);T.end=setTimeout(timeUp,left)}}
window.__appBack=function(){
  if(!$('ov').hidden){const x=$('ovc').querySelector('#sOk,#rOk,#qNo,#mmX,#fX,#fCancel,#noB,#naN,#wN,#nNo,#tHome,#rHome,#rvNo,#mmB');if(x){x.click();return true}return true}
  if(!$('game').hidden){askQuit();return true}
  if(curTab!=='Play'){tab('Play');return true}
  return false;
};
/* heat: stop timers + sound when the app is hidden (live matches keep running: the other player is waiting) */
document.addEventListener('visibilitychange',()=>{
  try{if(document.hidden)ac&&ac.suspend()}catch(e){}
  if(!G||G.done||G.held||G.mode==='live')return;
  if(document.hidden){
    if(G.live){G.left=Math.max(0,G.end-performance.now());G.live=false;clearT();freezeFuse();G.paused=1}
    else{clearT();G.paused=2}
  }else if(G.paused){
    const was=G.paused===1;G.paused=0;
    modal('<h2>잠깐 멈췄어요</h2><p class="c">준비되면 이어서 해요.</p><div class="row"><button class="btn pri" id="pGo">계속하기</button></div>');
    $('pGo').onclick=()=>{closeModal();resume(was)};
  }
});
window.addEventListener('resize',()=>{if(G&&G.pz&&!$('game').hidden){drawBoard();renderPath()}else banner()});

/* ================= boot ================= */
applyTheme();show('home');tab('Play');
if(P.seen)maybeAskNoti();else startTut();
if(APP){notiSync();setTimeout(()=>{if(adsRemoved()&&!P.adsOff){P.adsOff=1;save()}},2000)}
syncOnline();
</script>
