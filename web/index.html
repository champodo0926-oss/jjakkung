<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>브레인 별셈</title>
<style>
@font-face{font-family:"Jua";src:url(fonts/jua.woff2) format("woff2");font-display:block}
@font-face{font-family:"Gowun Dodum";src:url(fonts/gowun.woff2) format("woff2");font-display:block}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
</style>
<script src="firebase-config.js"></script>
<script src="online.js"></script>
<script>window.APP_VERSION="2.4"</script>
</head><body>
<style>
/* Layout: one-screen app. Home = tab pages (플레이/오늘/랭킹/내 정보) over a fixed tab bar; game = versus strip, target, board, expression. Single dark look by choice. */
:root{
  --ink:#10132e; --panel:#1a1e48; --panel2:#232862; --line:#333a80;
  --fg:#eef0ff; --mute:#9aa0d6; --num:#ffd166; --op:#6ee7f9; --hot:#ff6b6b; --ok:#5ee6a0;
  --cellbg:#232862; --celldig:#ffffff; --cellop:#6ee7f9; --opbg:#171b40; --path:#ffd166; --pathtx:#2a1d00;
  --fd:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fb:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --tabh:62px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font-family:var(--fb);font-size:15px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:var(--fd);color:inherit;border:0;cursor:pointer;background:none;font-size:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--op);outline-offset:2px}
input{font-family:var(--fd);font-size:18px;background:var(--ink);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box;text-align:center}
.scr{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px;box-sizing:border-box}
#home{padding-bottom:calc(var(--tabh) + 10px)}
/* cosmetic number themes */

.th-gold{--cellbg:#2b2346;--celldig:#ffd166;--cellop:#ffe9b0;--path:#ffb703;--pathtx:#2a1d00}
.th-neon{--cellbg:#0d2a3a;--celldig:#7cf7ff;--cellop:#ff7ad9;--opbg:#0b1830;--path:#7cf7ff;--pathtx:#00222a}
.th-cyber{--cellbg:#2a0f3a;--celldig:#ff4fd8;--cellop:#f7ff4f;--opbg:#1a0a26;--path:#f7ff4f;--pathtx:#251a00}
.th-magic{--cellbg:#2a1846;--celldig:#e9d7ff;--cellop:#b8f2c8;--opbg:#1c1032;--path:#c9a7ff;--pathtx:#1d0d33}

/* HOME */
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--fd);font-weight:400;font-size:30px;margin:0;letter-spacing:.5px}
.brand h1 b{color:var(--num);font-weight:400}
.gear{width:38px;height:38px;border-radius:11px;background:var(--panel);display:grid;place-items:center}
.gear svg{width:20px;height:20px}
.page{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1;padding-bottom:6px}
.prof{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.prof.gold{border-color:var(--num)}
.lvbadge{grid-row:span 2;width:52px;height:52px;border-radius:14px;background:var(--panel2);display:grid;place-items:center;font-family:var(--fd);font-size:22px;color:var(--num);line-height:1}
.lvbadge small{display:block;font-size:10px;color:var(--mute);text-align:center}
.ttl{font-family:var(--fd);font-size:18px;display:flex;gap:8px;align-items:baseline;min-width:0}
.ttl span{font-family:var(--fb);font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xpbar{height:8px;background:var(--ink);border-radius:8px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--num);border-radius:8px;transform-origin:left}
.xptx{grid-column:2;font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.sec{font-family:var(--fd);font-size:13px;color:var(--mute);letter-spacing:1px;margin:4px 2px -2px}
.mode{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%}
.mode .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--fd);font-size:22px;flex:none}
.mode .tx{flex:1;min-width:0}
.mode .tx b{display:block;font-family:var(--fd);font-weight:400;font-size:19px}
.mode .tx span{font-family:var(--fb);font-size:13px;color:var(--mute)}
.mode .rt{font-size:13px;color:var(--num);font-family:var(--fd);text-align:right}
.ai-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ai{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;font-size:14px;line-height:1.25}
.ai small{display:block;font-family:var(--fb);font-size:10.5px;color:var(--mute)}
.ai.lock{opacity:.4}
.ai.won{border-color:var(--ok)}
.ai.sel{background:var(--panel2);border-color:var(--num);box-shadow:inset 0 0 0 1px var(--num)}
.ai .ck{color:var(--ok);font-size:10px}
.duo{display:grid;gap:8px;margin-top:8px}
.duo .mode.lock{opacity:.5}
.lvlinks{display:flex;justify-content:flex-end;gap:14px;margin:2px 4px 0}
.lvlinks button{font-family:var(--fb);font-size:12.5px;color:var(--mute);text-decoration:underline;padding:4px 0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.box p{margin:0;line-height:1.5}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12.5px;color:var(--mute)}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--num)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.seg button{border-radius:9px;padding:8px;font-size:15px;color:var(--mute)}
.seg button.on{background:var(--panel2);color:var(--fg)}
.lb{display:flex;flex-direction:column;gap:6px}
.lr{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--panel);border-radius:12px;padding:9px 12px;font-size:14.5px}
.lr.me{border:1px solid var(--num)}
.lr .k{font-family:var(--fd);color:var(--mute);text-align:center}
.lr .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .nm small{color:var(--mute);margin-left:6px;font-size:12px}
.lr .v{font-family:var(--fd);color:var(--num);font-variant-numeric:tabular-nums}
.tier{display:flex;align-items:center;gap:12px}
.emb{width:54px;height:54px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal i{aspect-ratio:1.25;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--mute)}
.cal i.d{background:var(--op);color:#00222a;font-family:var(--fd)}
.cal i.t{outline:2px solid var(--num)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:var(--panel);border-radius:12px;padding:10px 6px;text-align:center;font-size:12px;color:var(--mute)}
.stat b{display:block;font-family:var(--fd);font-weight:400;font-size:20px;color:var(--fg)}

/* GAME */
.top{display:flex;align-items:center;gap:8px;min-height:36px}
.top .back{width:36px;height:36px;border-radius:10px;background:var(--panel);font-size:18px}
.top .md{font-family:var(--fd);font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .hp{color:var(--hot);font-size:16px;letter-spacing:2px}
.top .sc{font-family:var(--fd);font-size:18px;color:var(--num);font-variant-numeric:tabular-nums}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.side{display:flex;flex-direction:column;gap:5px;min-width:0}
.side .nm{font-family:var(--fd);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.r{text-align:right}
.pips{display:flex;gap:4px}
.side.r .pips{justify-content:flex-end}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--ink);border:1px solid var(--line)}
.pips i.me{background:var(--num);border-color:var(--num)}
.pips i.op{background:var(--hot);border-color:var(--hot)}
.vsx{font-family:var(--fd);color:var(--mute);font-size:13px}
.fuse{height:6px;background:var(--ink);border-radius:6px;overflow:hidden;grid-column:1/-1}
.fuse i{display:block;height:100%;width:100%;transform-origin:left;transform:scaleX(0)}
.fuse.fa i{background:var(--hot)}
.fuse.ft i{background:var(--op)}
.tgt{display:flex;align-items:center;justify-content:center;gap:14px}
.tgt .lbl{font-size:13px;color:var(--mute);font-family:var(--fd)}
.tgt .v{font-family:var(--fd);font-size:54px;line-height:1;color:var(--num);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}
.tgt .cb{font-family:var(--fd);font-size:14px;color:var(--ink);background:var(--op);border-radius:999px;padding:3px 10px;visibility:hidden}
.tgt .cb.on{visibility:visible}
.bwrap{position:relative;align-self:center;touch-action:none}
.board{display:grid;gap:6px;position:relative;z-index:1}
.cell{display:grid;place-items:center;font-family:var(--fd);border-radius:12px;position:relative}
.cell.n{background:var(--cellbg);color:var(--celldig)}
.cell.o{color:var(--cellop);background:var(--opbg);border-radius:50%;transform:scale(.72)}
.cell.on.n{background:var(--path);color:var(--pathtx)}
.cell.on.o{background:var(--path);color:var(--pathtx);transform:scale(.8)}
.cell.aip.n,.cell.aip.o{background:var(--hot);color:#2b0606}
.cell.tip{outline:3px solid var(--op);outline-offset:-3px}
.cell.win{animation:pop .42s ease-out 1}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.12)}100%{transform:scale(1)}}
.cell.o.win{animation:none}
svg.pl{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:visible}
svg.pl polyline{fill:none;stroke-linecap:round;stroke-linejoin:round}
.expr{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.expr .e{font-family:var(--fd);font-size:20px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.expr .h{font-size:12.5px;color:var(--mute)}
.expr .bad{color:var(--hot)}
.ctl{display:flex;gap:8px;justify-content:center}
.btn{font-size:16px;background:var(--panel2);border-radius:12px;padding:10px 16px}
.btn.pri{background:var(--num);color:#2a1d00}
.btn.hot{background:var(--hot);color:#2b0606}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:40;font-family:var(--fd);font-size:30px;pointer-events:none;opacity:0;text-align:center;white-space:nowrap}
.toast.go{animation:tst 1.1s ease-out 1}
.toast small{display:block;font-size:16px;color:var(--fg)}
.toast.sm{font-size:18px;background:var(--panel2);padding:10px 16px;border-radius:12px;white-space:normal;max-width:80vw}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-30%) scale(.9)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* overlays */
.ov{position:fixed;inset:0;z-index:30;background:rgba(8,10,30,.88);display:grid;place-items:center;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px 18px;width:100%;max-width:380px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.card h2{font-family:var(--fd);font-weight:400;font-size:26px;margin:0;text-align:center;text-wrap:balance}
.card p{margin:0;line-height:1.55;font-size:14.5px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.c{text-align:center}
.mut{color:var(--mute);font-size:13px}
.big{font-family:var(--fd);font-size:44px;text-align:center;color:var(--num);line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv b{font-family:var(--fd);font-weight:400;color:var(--num);text-align:right}
.demo{display:grid;grid-template-columns:repeat(5,34px);gap:4px;justify-content:center;margin:2px 0}
.demo span{height:34px;display:grid;place-items:center;font-family:var(--fd);font-size:18px;border-radius:9px;background:var(--panel2)}
.demo span.o{color:var(--op);background:transparent}
.demo span.on{background:var(--num);color:#2a1d00}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.thb{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center;font-size:14px;display:flex;flex-direction:column;gap:6px;align-items:center}
.thb .sw{display:flex;gap:4px}
.thb .sw i{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-size:14px}
.thb.sel{border-color:var(--num)}
.thb.lock{opacity:.45}
.thb small{font-family:var(--fb);font-size:11px;color:var(--mute)}
.set{display:flex;flex-direction:column;gap:2px}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);font-size:15px;text-align:left;width:100%}
.sr:last-child{border-bottom:0}
.sr .r{font-family:var(--fd);color:var(--num);font-size:14px}
.code{font-family:var(--fd);font-size:46px;letter-spacing:8px;text-align:center;color:var(--num)}

/* 1.1 screen themes from 별잇기 (whole-screen colors; number themes above still override the board cells) */
html[data-th=dawn]{--ink:#f6eefa;--panel:#ffffff;--panel2:#efe4f7;--line:#dccbea;--fg:#2e2245;--mute:#7a6c93;--num:#d9791a;--op:#7b5cd6;--hot:#e5484d;--ok:#1f9d6b;--cellbg:#efe4f7;--celldig:#2e2245;--cellop:#7b5cd6;--opbg:#ffffff;--path:#f0a03c;--pathtx:#2a1600;color-scheme:light}
html[data-th=xmas]{--ink:#0c2418;--panel:#163626;--panel2:#1f4a34;--line:#2f6248;--mute:#a7c9b4;--num:#ffcf4a;--op:#ff9d9d;--hot:#ff5c5c;--cellbg:#1f4a34;--cellop:#ff9d9d;--opbg:#122c1f;--path:#ffcf4a}
html[data-th=sakura]{--ink:#1f1230;--panel:#2a1a40;--panel2:#3a2452;--line:#553a73;--mute:#c4a9d8;--num:#ff9ec4;--op:#ffd6e7;--cellbg:#3a2452;--cellop:#ffc2da;--opbg:#241634;--path:#ff9ec4;--pathtx:#2a0a18}
html[data-th=sea]{--ink:#06222e;--panel:#0c3140;--panel2:#124556;--line:#1d5d70;--mute:#8fbccb;--num:#5fe3e8;--op:#9ef0c8;--cellbg:#124556;--cellop:#9ef0c8;--opbg:#08283a;--path:#5fe3e8;--pathtx:#002a2e}
/* targets: 3 chips, crossed out when someone finds them */
.tgt .tv{display:flex;gap:8px;justify-content:center}
.tc{font-family:var(--fd);font-size:38px;line-height:1;color:var(--num);min-width:2ch;text-align:center;padding:6px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.tv.one .tc{font-size:54px;background:none;border:0}
.tc.me{color:var(--ok);text-decoration:line-through;opacity:.6}
.tc.op{color:var(--hot);text-decoration:line-through;opacity:.6}
.tc.wait{border:2px dashed var(--op)}
.tc.x{opacity:.3;text-decoration:line-through}
/* 별콩이 (layered webp art from 별잇기) */
.kong-f{display:inline-block;width:62px;height:62px;position:relative;flex:none}
.kong-f.sm{width:34px;height:34px}
.kong-f.sm2{width:40px;height:40px;margin-left:-14px;align-self:flex-end}
.kong-f.big{width:118px;height:118px}
.cd3l{position:absolute;inset:0}
.cd3l img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.kong-f.hop{animation:hop .5s ease-out 1}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.kongh{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px 12px;width:100%;font-family:var(--fb)}
.kbub{flex:1;font-size:14px;line-height:1.45;color:var(--fg)}
.ksay{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 14px;font-size:14px;max-width:min(80vw,380px);width:max-content;pointer-events:none;opacity:0;text-align:center}
.ksay.go{animation:ksay 2.6s ease-out 1}
@keyframes ksay{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
#deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#deco span{position:absolute}
/* 꾸미기 */
.seg4{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border-radius:12px;padding:4px;gap:4px}
.seg4 button{border-radius:9px;padding:8px 2px;font-size:14px;color:var(--mute)}
.seg4 button.on{background:var(--panel2);color:var(--fg)}
.its{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.it{border:1px solid var(--line);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--panel)}
.it.on{border-color:var(--num)}
.it small{font-family:var(--fb);font-size:12px}
.it em{font-style:normal;font-size:11px;color:var(--mute);font-family:var(--fd)}
.it .mini{width:48px;height:48px;position:relative;display:grid;place-items:center;font-size:18px;color:var(--mute)}
.sw2{display:flex;gap:3px}
.sw2 i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-family:var(--fd);font-size:13px;background:var(--cellbg);color:var(--celldig)}
.sw2 i.o{background:var(--opbg);color:var(--cellop);border-radius:50%}
.sw3{width:48px;height:34px;border-radius:9px;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding-bottom:5px;box-sizing:border-box;border:1px solid var(--line)}
.sw3 i{width:12px;height:12px;border-radius:50%}
.kpv{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
/* 1.2 별자리 퍼즐 (별잇기 숫자 채우기 look: white circles, gold stars, violet path) */
:root{--nfl:#8b7dff}
#star{gap:8px}
.nf-zoom{height:86px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-sizing:border-box;padding:4px}
.nf-zoom .zhint{font-size:13.5px;color:var(--mute);text-align:center;line-height:1.45}
.nf-zoom .zrow{display:flex;align-items:center;justify-content:center}
.nf-zoom .zc,.nf-zoom .zs{flex:none}
.nf-zoom .zl{flex:none;width:10px;height:4px;background:var(--nfl)}
.zwhy{font-size:12.5px;color:var(--hot)}
.zsum{font-size:12.5px;color:var(--mute)}
.nf-board{position:relative;align-self:center;flex:none}
.nf-ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.nf-ln .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:nfDraw .5s ease-out forwards}

<script>
'use strict';
const TEST_UNLOCK_ALL=false;
const VER=window.APP_VERSION||'web';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const APP=window.AndroidApp||null;
const ONLINE=()=>!!(window.claude&&window.claude.online);

/* ================= profile (one object, like 별잇기) ================= */
const KEY='brainrush.v1';
let P={xp:0,beaten:0,best:0,day:{},theme:'base',snd:1,vib:1,unlock:0,seen:0,nick:'',rp:0,games:0,wins:0,solved:0,ss:{id:'',sc:0},streak:{last:'',n:0},noti:0,notiAsk:0,adsOff:0,results:0};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)P=Object.assign(P,s)}catch(e){}
if(!P.nick)P.nick='러셔'+String(1000+Math.floor(Math.random()*9000));
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
const UNLOCK=()=>TEST_UNLOCK_ALL||P.unlock;
function adsRemoved(){if(P.adsOff)return true;try{return !!(APP&&APP.adsRemoved&&APP.adsRemoved())}catch(e){return false}}

/* ================= sound: tone() from 별잇기 ================= */
let ac=null;
function tone(f,d=.09,type='triangle',vol=.1,delay=0){if(!P.snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sTap=()=>tone(660,.05,'triangle',.06), sWin=()=>{tone(784,.1);tone(1046,.14,'triangle',.1,.08)}, sLose=()=>{tone(300,.16,'sawtooth',.05);tone(220,.2,'sawtooth',.05,.12)}, sBig=()=>{tone(660,.1);tone(880,.1,'triangle',.1,.1);tone(1320,.2,'triangle',.1,.2)};
function buzz(ms){if(!P.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ================= level / titles / ranks ================= */
const TITLES=[[1,'계산 견습생'],[5,'브레인 헌터'],[10,'수학 마스터'],[18,'천재 전략가'],[30,'계산의 신']];
const need=lv=>80+40*lv;
function lvOf(xp){let lv=1;while(xp>=need(lv)){xp-=need(lv);lv++}return{lv,rest:xp,need:need(lv)}}
function titleOf(lv){let t=TITLES[0][1];for(const [l,n] of TITLES)if(lv>=l)t=n;return t}
const THEMES=[['base','기본',1],['gold','골드',3],['neon','네온',6],['cyber','사이버펑크',9],['magic','마법진',13]];
function applyTheme(){document.body.className=P.theme==='base'?'':'th-'+P.theme}
const TIERS=[['브론즈',0,'#c98a5a'],['실버',100,'#c4cbe0'],['골드',250,'#ffd166'],['플래티넘',450,'#7ee0d0'],['다이아',700,'#8fb6ff'],['마스터',1000,'#c9a7ff'],['그랜드마스터',1400,'#ff8fa3']];
function tierOf(rp){let k=0;TIERS.forEach((t,i)=>{if(rp>=t[1])k=i});return k}
function emblem(k,s=54){const c=TIERS[k][2];const pts=[];const n=k+3;for(let i=0;i<n*2;i++){const a=Math.PI*i/n-Math.PI/2,r=i%2?13:24;pts.push((27+r*Math.cos(a)).toFixed(1)+','+(29+r*Math.sin(a)).toFixed(1))}
  return '<svg class="emb" width="'+s+'" height="'+s+'" viewBox="0 0 54 56"><polygon points="'+pts.join(' ')+'" fill="'+c+'" stroke="#10132e" stroke-width="2"/><text x="27" y="34" text-anchor="middle" font-family="Jua" font-size="14" fill="#10132e">'+['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ'][k]+'</text></svg>'}
function monthKey(){const t=new Date(Date.now()+9*3600e3);return t.getUTCFullYear()+'-'+String(t.getUTCMonth()+1).padStart(2,'0')}
function todayKey(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function addXp(x){const mk=monthKey();if(P.ss.id!==mk)P.ss={id:mk,sc:0};P.ss.sc+=x;P.xp+=x}

/* ================= AI ================= */
const AIS=[
  /* 1.9 (젠다): 계산 판은 모두 4×4 하나. 난이도 = 쓰는 연산·이어야 할 숫자 수·목표 크기·정답 길 수(높은 단계는 3~4개뿐)·AI 속도 */
  /* 2.2 (젠다): 전체적으로 쉽게, 남녀노소. 길은 짧게(mx = 한 길에 쓰는 숫자 최대 개수), 목표는 작게, 조금씩 어려워지게 */
  /* 젠다 길 길이(한 길의 숫자 개수): 초보 2개 → 나중에 최대 3개 · 중간 3~4개, 최대 5개 · 마스터 4~6개 */
  {nm:'초보',bot:'꼬마봇',t:[20,32],tg:{n:4,ops:'+×',min:2,mx:3,lo:4,hi:20}},
  {nm:'보통',bot:'연필봇',t:[15,24],tg:{n:4,ops:'+−',min:2,mx:4,lo:5,hi:25}},
  {nm:'어려움',bot:'주판봇',t:[12,18],tg:{n:4,ops:'+−×',min:3,mx:4,lo:8,hi:40}},
  {nm:'천재',bot:'알파봇',t:[9,14],tg:{n:4,ops:'+−×',min:3,mx:5,lo:10,hi:50,wmax:8}},
  {nm:'마스터',bot:'제로봇',t:[7,11],tg:{n:4,ops:'+−×÷',min:4,mx:6,lo:10,hi:60,wmax:6}},
];
const LIVE_TG={n:4,ops:'+−×',min:2,mx:3,lo:5,hi:30};

/* ================= RNG + generator ================= */
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
let rnd=Math.random;
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
function ap(a,op,b){switch(op){case'+':return a+b;case'−':return a-b;case'×':return a*b;case'÷':return(b&&a%b===0)?a/b:null}}
function nbr(n,i){const r=i/n|0,c=i%n,o=[];if(r)o.push(i-n);if(r<n-1)o.push(i+n);if(c)o.push(i-1);if(c<n-1)o.push(i+1);return o}
function genBoard(n,ops){const cells=[];for(let i=0;i<n*n;i++){const r=i/n|0,c=i%n;if((r+c)%2===0)cells.push({t:'n',v:ri(1,9)});else if(ops)cells.push({t:'o',v:ops[Math.floor(rnd()*ops.length)]});else{const x=rnd()*9;cells.push({t:'o',v:x<3?'+':x<5?'−':x<8?'×':'÷'})}}return{n,cells}}
function enumerate(B,maxNums){
  const n=B.n,C=B.cells,map=new Map(),vis=new Uint8Array(n*n),path=[];
  function dfs(i,val,k){
    if(k>=2){let e=map.get(val);if(!e)map.set(val,e={min:k,cnt:0,path:path.slice()});else if(k<e.min){e.min=k;e.path=path.slice()}e.cnt++}
    if(k>=maxNums)return;
    for(const o of nbr(n,i)){if(vis[o])continue;vis[o]=1;path.push(o);
      for(const m of nbr(n,o)){if(vis[m])continue;const nv=ap(val,C[o].v,C[m].v);if(nv===null||Math.abs(nv)>999)continue;vis[m]=1;path.push(m);dfs(m,nv,k+1);path.pop();vis[m]=0}
      path.pop();vis[o]=0}
  }
  for(let i=0;i<n*n;i++)if(C[i].t==='n'){vis[i]=1;path.push(i);dfs(i,C[i].v,1);path.pop();vis[i]=0}
  return map;
}
/* target set: one board, K targets that really exist on it (1.1: 젠다 — 한 판에 목표 여러 개) */
const K_PER=3;
/* 1.7 (젠다): 목표 숫자는 1개, 그 숫자를 만드는 서로 다른 길 K개를 찾아요. 같은 칸들로 된 길은 한 번만 */
function keyOf(p){return p.slice().sort((a,b)=>a-b).join(',')}
function pathsFor(B,target,maxNums){const n=B.n,C=B.cells,vis=new Uint8Array(n*n),pth=[],out=new Map();
  function dfs(i,val,k){if(k>=2&&val===target){const key=keyOf(pth),ex=out.get(key);if(!ex||pth.length<ex.length)out.set(key,pth.slice())}
    if(k>=maxNums)return;for(const o of nbr(n,i)){if(vis[o])continue;vis[o]=1;pth.push(o);for(const m of nbr(n,o)){if(vis[m])continue;const nv=ap(val,C[o].v,C[m].v);if(nv===null||Math.abs(nv)>999)continue;vis[m]=1;pth.push(m);dfs(m,nv,k+1);pth.pop();vis[m]=0}pth.pop();vis[o]=0}}
  for(let i=0;i<n*n;i++)if(C[i].t==='n'){vis[i]=1;pth.push(i);dfs(i,C[i].v,1);pth.pop();vis[i]=0}
  return [...out.entries()].map(([key,p])=>({key,p})).sort((a,b)=>a.p.length-b.p.length)}
function allWays(B,maxNums){const n=B.n,C=B.cells,vis=new Uint8Array(n*n),pth=[],out=new Map();
  function dfs(i,val,k){if(k>=2){let e=out.get(val);if(!e)out.set(val,e={min:k,W:new Map()});if(k<e.min)e.min=k;const key=keyOf(pth),ex=e.W.get(key);if(!ex||pth.length<ex.length)e.W.set(key,pth.slice())}
    if(k>=maxNums)return;for(const o of nbr(n,i)){if(vis[o])continue;vis[o]=1;pth.push(o);for(const m of nbr(n,o)){if(vis[m])continue;const nv=ap(val,C[o].v,C[m].v);if(nv===null||Math.abs(nv)>999)continue;vis[m]=1;pth.push(m);dfs(m,nv,k+1);pth.pop();vis[m]=0}pth.pop();vis[o]=0}}
  for(let i=0;i<n*n;i++)if(C[i].t==='n'){vis[i]=1;pth.push(i);dfs(i,C[i].v,1);pth.pop();vis[i]=0}
  return out}
function slots(v,min,ways,K){return Array.from({length:K},(_,i)=>({v,min,sol:ways[i%ways.length].p,key:null,who:null}))}
function makeBoard(o,K){
  for(let tries=0;tries<80;tries++){
    /* 1.9 (젠다): 계산 판은 4×4. 판의 모든 길을 한 번에 세어서, 정말 K개 이상(높은 단계는 wmax개 이하) 있는 목표만 */
    const B=genBoard(o.n,o.ops),A=allWays(B,o.mx||(o.n*o.n>>1)),cand=[];
    for(const [v,e] of A){const c=e.W.size;if(v>=o.lo&&v<=o.hi&&e.min>=o.min&&e.min<=o.min+1&&c>=K&&(!o.wmax||c<=o.wmax))cand.push([v,e])}
    if(cand.length){const [v,e]=cand[Math.floor(rnd()*cand.length)];const W=[...e.W.entries()].map(([key,p])=>({key,p})).sort((a,b)=>a.p.length-b.p.length);return{B,v,ways:W,T:slots(v,e.min,W,K)}}
  }
  if(o.wmax)return makeBoard(Object.assign({},o,{wmax:0}),K);
  return makeBoard(Object.assign({},o,{min:2,lo:2,hi:999}),K);
}
function makePuzzle(o){const b=makeBoard(o,1);return{B:b.B,target:b.T[0].v,min:b.T[0].min,sol:b.T[0].sol}}
function tutPuzzle(){ /* fixed first board for the guided start (1.9: 4×4). 4+3×2, 7×2, 9+5 = 14 */
  const L=[4,'+',3,'−', '×',5,'×',8, 9,'+',2,'+', '÷',7,'×',2];
  const cells=L.map(v=>typeof v==='number'?{t:'n',v}:{t:'o',v});const B={n:4,cells};
  return{B,v:14,ways:[...allWays(B,8).get(14).W.entries()].map(([key,p])=>({key,p})).sort((a,b)=>a.p.length-b.p.length),T:[{v:14,min:3,sol:[0,1,2,6,10],key:null,who:null}]};
}

/* ================= game state ================= */
let G=null,path=[],drag=false,cs=56,gap=6;
const T={};
function clearT(){for(const k in T){clearTimeout(T[k]);delete T[k]}}
function setRnd(seed){rnd=seed==null?Math.random:mul(seed)}
const DAY_BOARDS=4;
/* 2.0 (젠다 "별잇기랑 동일한 조건"): IQ 도전 · 계산 대결 = 별자리 퍼즐 IQ와 같은 틀. 3판(초보·보통·어려움 = 새싹·별빛·달빛), 시간 제한 없음, 힌트 1번, 빠를수록·힌트 안 쓸수록 높은 IQ */
const IQ_PLAN=[0,1,2],IQ_LIM=[30,60,100];

function startTut(){setRnd(null);G={mode:'tut',score:0,combo:0,best:0,solved:0,stage:0};begin(tutPuzzle(),0)}
function startVs(lv){setRnd(null);G={mode:'vs',lv,ai:AIS[lv],me:0,op:0,goal:5,score:0,combo:0,best:0,solved:0,stage:0};nextPuzzle()}
function startInf(){setRnd(null);G={mode:'inf',hp:3,score:0,combo:0,best:0,solved:0,stage:0,revived:0};nextPuzzle()}
function startDay(){const d=todayKey();setRnd(hashStr('day'+d));G={mode:'day',score:0,combo:0,best:0,solved:0,stage:0,total:DAY_BOARDS,key:d};nextPuzzle()}
function startIq(){
  const go=()=>{closeModal();setRnd(null);G={mode:'iq',score:0,combo:0,best:0,solved:0,stage:0,total:IQ_PLAN.length,fr:[],res:[]};nextPuzzle()};
  modal('<h2>IQ 도전</h2><p class="c">계산 판 3판(초보·보통·어려움)을 풀어요. 판마다 목표 숫자를 만드는 길 3개를 찾으면 다음 판이에요. 빨리, 힌트 없이 풀수록 IQ가 올라가요.</p><p class="c mut">시간 제한은 없어요. 길을 찾을 때마다 위에 IQ가 바로 바뀌어요. 힌트는 판마다 1번, 막히면 그 판을 넘길 수 있지만 그 판은 실패예요.</p><div class="row"><button class="btn pri" id="iqGo">시작</button><button class="btn" id="iqRule">규칙 보기</button><button class="btn" id="byN">닫기</button></div>');
  $('iqGo').onclick=go;$('iqRule').onclick=()=>rules();$('byN').onclick=closeModal}

function soloParams(s){return AIS[s<3?0:s<6?1:s<10?2:s<16?3:4].tg}
function soloLimit(s,min){return Math.max(16,38-s)+(min-2)*4}

function nextPuzzle(){
  const m=G.mode;let pz,dur=0;
  if(m==='vs')pz=makeBoard(G.ai.tg,K_PER);
  else if(m==='live'){setRnd(hashStr(G.room+'#'+G.stage));pz=makeBoard(LIVE_TG,K_PER);dur=90000}
  else if(m==='iq'){pz=makeBoard(AIS[IQ_PLAN[G.stage]].tg,K_PER);dur=0;G.t0=performance.now();G.hints=1}
  else{const s=m==='day'?G.stage*3:G.stage*2;pz=makeBoard(soloParams(s),K_PER);dur=Math.round(soloLimit(s,pz.T[0].min)*2.2)*1000}
  begin(pz,dur);
  if(m==='live'&&G.res)liveApply(G.res);
}
function openT(){return G.pz.T.filter(t=>!t.who)}
function begin(pz,dur){
  clearT();path=[];G.pz=pz;G.pzStage=G.stage;G.live=true;G.dur=dur;G.wait=0;G.lastAt=performance.now();
  show('game');drawBoard();
  renderHud();renderPath();
  const now=performance.now();G.end=now+dur;
  if(dur){runFuse(dur,dur);T.end=setTimeout(timeUp,dur)}else{const f=$('fuseI');f.style.transition='none';f.style.transform='scaleX(0)'}
  if(G.mode==='vs')aiArm();
  if(G.mode==='tut')tutHint();
}
function runFuse(left,total){
  const f=$('fuseI');
  f.style.transition='none';f.style.transform='scaleX('+(1-left/total)+')';
  f.getBoundingClientRect();
  f.style.transition='transform '+left+'ms linear';f.style.transform='scaleX(1)';
}
function freezeFuse(){const f=$('fuseI');const cur=getComputedStyle(f).transform;f.style.transition='none';f.style.transform=cur}

/* AI: works on the board the whole time and takes one target each time its timer runs out */
function aiArm(){const L=openT();if(!L.length)return;const [a,b]=G.ai.t;const mn=Math.min(...L.map(t=>t.min));
  G.aiDur=(a+Math.random()*(b-a))*(1+.22*(mn-2))*1000;G.aiEnd=performance.now()+G.aiDur;runFuse(G.aiDur,G.aiDur);T.ai=setTimeout(aiClaim,G.aiDur)}
function aiFreeze(){if(!T.ai)return;clearTimeout(T.ai);const now=performance.now();const l=Math.max(0,G.aiEnd-now)+3000;G.aiDur+=3000;G.aiEnd=now+l;runFuse(l,G.aiDur);T.ai=setTimeout(aiClaim,l);setTimeout(()=>toast('AI 얼림 +3초','var(--op)'),400)}
function aiClaim(){
  delete T.ai;if(!G||!G.live||G.mode!=='vs')return;const L=openT();if(!L.length)return;
  const t=L[0],used=new Set(G.pz.T.map(x=>x.key).filter(Boolean)),w=(G.pz.ways||[]).find(x=>!used.has(x.key));if(w){t.key=w.key;t.sol=w.p}t.who='op';G.op++;G.combo=0;sLose();buzz(40);
  renderHud();flashOp(t.sol);toast(G.ai.bot+' 득점','var(--hot)',String(t.v));
  if(G.op>=G.goal){G.live=false;clearT();freezeFuse();T.nx=setTimeout(()=>finish(false),1400);return}
  if(!openT().length){boardDone();return}
  aiArm();
}
function flashOp(p){const kids=$('board').children;for(const i of p)kids[i].classList.add('aip');$('pl').insertAdjacentHTML('beforeend',line(p,'var(--hot)'));
  clearTimeout(T.fl);T.fl=setTimeout(()=>{delete T.fl;if(G&&G.pz&&G.live)renderPath()},1100)}

function timeUp(){
  if(!G||!G.live)return;
  if(G.mode==='live'){if(G.host)liveTimeout();return}
  G.live=false;clearT();freezeFuse();G.combo=0;sLose();buzz(60);
  const L=openT();L.forEach(t=>t.who='x');
  if(L.length){const used=new Set(G.pz.T.map(x=>x.key).filter(Boolean)),w=(G.pz.ways||[]).find(x=>!used.has(x.key));showOpPath(w?w.p:L[0].sol,'못 찾은 길 '+L.length+'개 · 이런 길도 있어요',G.pz.v)}
  if(G.mode==='inf')G.hp--;
  toast('시간 끝','var(--hot)');renderHud();G.stage++;
  T.nx=setTimeout(afterRound,1900);
}
function boardDone(){G.live=false;clearT();freezeFuse();
  if(G.mode==='step')return stepWin();
  if(G.mode==='iq'){const sec=(performance.now()-G.t0)/1000;G.res.push({ok:true,sec,v:iqPzVal(sec,IQ_LIM[G.stage],0,G.hints)});renderHud();sBig();toast('판 완성!','var(--num)','IQ '+iqRush());G.stage++;T.nx=setTimeout(afterRound,1400);return}
  G.stage++;T.nx=setTimeout(afterRound,1100)}
function iqHint(){if(G&&G.mode==='step')return stepHint();if(!G||G.mode!=='iq'||!G.live)return;if(G.hints<=0)return note('IQ 도전에서는 힌트가 1번이에요');
  const used=new Set(G.pz.T.map(t=>t.key).filter(Boolean)),w=G.pz.ways.find(x=>!used.has(x.key));if(!w)return;
  G.hints--;const kids=$('board').children;w.p.slice(0,3).forEach(i=>kids[i].classList.add('tip'));sTap();renderHud();
  const C=G.pz.B.cells;$('expr').innerHTML='<span class="e">💡</span><span class="h">빛나는 <b style="color:var(--fg)">'+C[w.p[0]].v+' '+C[w.p[1]].v+' '+C[w.p[2]].v+'</b>부터 시작해 보세요</span>'}
function iqSkip(){if(!G||G.mode!=='iq'||!G.live)return;
  modal('<h2>이 판을 넘길까요?</h2><p class="c">넘기면 이 판은 실패로 쳐요.</p><div class="row"><button class="btn pri" id="qNo">계속 찾기</button><button class="btn" id="qYes">넘기기</button></div>');
  $('qNo').onclick=closeModal;$('qYes').onclick=()=>{closeModal();if(!G||!G.live)return;const sec=(performance.now()-G.t0)/1000;G.res.push({ok:false,sec,v:0});G.live=false;clearT();sLose();
    const used=new Set(G.pz.T.map(t=>t.key).filter(Boolean)),w=G.pz.ways.find(x=>!used.has(x.key));if(w)showOpPath(w.p,'이런 길도 있었어요',G.pz.v);
    renderHud();toast('판 넘김','var(--hot)','IQ '+iqRush());G.stage++;T.nx=setTimeout(afterRound,1900)}}
function afterRound(){
  if(!G)return;
  if(G.mode==='vs'){if(G.me>=G.goal)return finish(true);if(G.op>=G.goal)return finish(false)}
  if(G.mode==='inf'&&G.hp<=0)return offerRevive();
  if(G.mode==='iq'&&G.stage>=G.total)return finish(true);
  if(G.mode==='day'&&G.stage>=G.total)return finish(true);
  if(G.mode==='live')return;
  nextPuzzle();
}
function solved(idx){
  const t=G.pz.T[idx],now=performance.now();
  const frac=G.mode==='vs'?Math.max(0,1-(now-G.lastAt)/20000):G.dur?Math.max(0,(G.end-now)/G.dur):1;
  G.lastAt=now;G.lastFrac=frac;if(G.fr)G.fr.push(frac);
  const nums=(path.length+1)/2;
  G.combo++;G.best=Math.max(G.best,G.combo);G.solved++;
  const mult=Math.min(3,1+.2*(G.combo-1));
  const pts=Math.round((100+40*(nums-2))*(.5+.5*frac)*mult);
  G.score+=pts;
  sWin();buzz(20);
  const kids=$('board').children;for(const i of path){kids[i].classList.remove('win');void kids[i].offsetWidth;kids[i].classList.add('win')}
  path=[];
  if(G.mode==='tut'){t.who='me';G.live=false;clearT();renderHud();T.nx=setTimeout(tutDone,900);return}
  if(G.mode==='live'){G.pend=G.pend||{};G.pend[G.stage+'.'+idx]=pts;t.who='wait';renderHud();renderPath();if(G.host)liveDecide(idx,'H');else liveClaim(idx);return}
  t.who='me';
  toast('+'+pts,'var(--num)',G.combo>1?'콤보 x'+G.combo:'');
  if(G.mode==='vs'){G.me++;if(G.combo%3===0)aiFreeze();
    if(G.me>=G.goal){G.live=false;clearT();freezeFuse();renderHud();renderPath();T.nx=setTimeout(()=>finish(true),1000);return}}
  renderHud();renderPath();
  if(!openT().length)boardDone();
}
function pauseG(){const was=G.live;if(was){const now=performance.now();G.left=Math.max(0,G.end-now);if(G.mode==='vs'&&G.aiEnd)G.aiLeft=Math.max(0,G.aiEnd-now)}
  if(G.mode==='iq'&&was)G.pz0=performance.now();
  G.live=false;clearT();freezeFuse();return was}

/* ================= board ================= */
function drawBoard(){
  const B=G.pz.B,n=B.n,b=$('board');
  const W=Math.min(document.documentElement.clientWidth-32,428);
  const H=window.innerHeight-330;
  gap=n>6?4:6;
  cs=Math.floor(Math.min((W-gap*(n-1))/n,(H-gap*(n-1))/n,72));cs=Math.max(cs,30);
  b.style.gridTemplateColumns='repeat('+n+','+cs+'px)';
  b.innerHTML='';
  B.cells.forEach((c,i)=>{const d=document.createElement('div');d.className='cell '+c.t;d.dataset.i=i;d.style.height=cs+'px';d.style.fontSize=(c.t==='n'?cs*.5:cs*.55)+'px';d.textContent=c.v;b.appendChild(d)});
  const sz=n*cs+(n-1)*gap;const svg=$('pl');svg.setAttribute('viewBox','0 0 '+sz+' '+sz);svg.style.width=sz+'px';svg.style.height=sz+'px';
}
function ctr(i){const n=G.pz.B.n,r=i/n|0,c=i%n;return[(c*(cs+gap)+cs/2).toFixed(1),(r*(cs+gap)+cs/2).toFixed(1)]}
function evalPath(p){const C=G.pz.B.cells;let v=C[p[0]].v;for(let k=1;k+1<p.length;k+=2){v=ap(v,C[p[k]].v,C[p[k+1]].v);if(v===null)return null}return v}
function line(p,col){return '<polyline stroke="'+col+'" stroke-opacity=".6" stroke-width="'+Math.max(4,cs*.16)+'" points="'+p.map(i=>ctr(i).join(',')).join(' ')+'"/>'}
function renderPath(){
  const C=G.pz.B.cells,kids=$('board').children,V=G.pz.v;
  for(const el of kids)el.classList.remove('on','aip');
  for(const i of path)kids[i].classList.add('on');
  $('pl').innerHTML=path.length>1?line(path,'var(--path)'):'';
  const ex=$('expr'),left=openT().length,sv=$('sumV'),sb=$('sumBox');
  if(!path.length){sv.textContent='0';sb.className='sum';
    if(G.pz.T.some(t=>t.who==='wait')){ex.innerHTML='<span class="e">확인 중…</span><span class="h">누가 먼저였는지 보고 있어요 · 다른 길도 찾아요</span>';return}

function cellAt(x,y){const el=document.elementFromPoint(x,y);if(!el||!el.classList.contains('cell'))return -1;
  const r=el.getBoundingClientRect(),dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2),lim=cs*.42;
  if(Math.abs(dx)>lim||Math.abs(dy)>lim)return -1;return +el.dataset.i}

  else if(path.includes(i))path=path.slice(0,path.indexOf(i)+1);

  else if(C[i].t==='n'&&C[last].t==='n'){const common=nbr(G.pz.B.n,last).filter(o=>!path.includes(o)&&adj(o,i));if(common.length===1)path.push(common[0],i);else path=[i]}
  else if(C[i].t==='n')path=[i];

  drag=true;sTap();
  try{$('bwrap').setPointerCapture(e.pointerId)}catch(_){}
  renderPath();check();
}

  const last=path[path.length-1];if(i===last)return;

}

/* ---- live match (ranked + friend). Host decides every round, guest claims. ---- */
let ROOM=null,mmTimer=null,mmDoc=null;
/* 1.1 board of 3 targets. res = boards joined by '|', one char per target: '.' open, 'H' host, 'G' guest, '-' nobody.
   Host is the referee; guest sends its claims as "stage.idx" list in presence.cl */
async function joinRoom(code,host,ranked,opNick){
  const R=await (await claude.use('room')).join(code);ROOM=R;
  G={mode:'live',room:code,host,ranked,stage:0,me:0,op:0,goal:5,score:0,combo:0,best:0,solved:0,res:'',cl:'',opNick:opNick||'',started:0,seen:{},pend:{}};
  R.presence({n:P.nick.slice(0,12),rp:P.rp,host:host?1:0,res:'',cl:''});
  R.onPeers(onPeers);onPeers();
}
function opPeer(){if(!ROOM)return null;return ROOM.peers().find(p=>!p.sameTab)||null}
function onPeers(){
  if(!G||G.mode!=='live'||G.done)return;
  const op=opPeer();
  if(!op){if(G.started&&!T.gone)T.gone=setTimeout(()=>{if(G&&G.mode==='live'&&!G.done&&!opPeer()){G.forfeit=1;liveEnd(true)}},8000);return}
  if(T.gone){clearTimeout(T.gone);delete T.gone}
  const pr=op.presence||{};if(pr.n)G.opNick=pr.n;
  if(!G.started){G.started=1;closeModal();modal('<h2>상대를 찾았어요</h2><p class="c" style="font-family:var(--fd);font-size:20px">'+esc(P.nick)+' <span class="mut">VS</span> '+esc(G.opNick)+'</p><p class="c mut">한 판에 길 3개 · 5점 먼저 내면 이겨요</p>');sBig();
    T.st=setTimeout(()=>{closeModal();G.stage=0;nextPuzzle()},1600);return}
  if(G.host){G.clDone=G.clDone||{};for(const c of String(pr.cl||'').split(',')){if(!c||G.clDone[c])continue;G.clDone[c]=1;const [st,i]=c.split('.').map(Number);const b=curRes(st);const j=b[i]==='.'?i:b.indexOf('.');if(j>=0)liveSetRes(st,j,'G')}}
  else{const r=pr.res||'';if(r&&r!==G.res)liveApply(r)}
}
function curRes(st,res){const a=(res!=null?res:G.res).split('|');return a[st]||'.'.repeat(K_PER)}
function liveSetRes(st,i,ch){const a=G.res?G.res.split('|'):[];while(a.length<=st)a.push('.'.repeat(K_PER));const b=a[st].split('');b[i]=ch;a[st]=b.join('');G.res=a.join('|');ROOM&&ROOM.presence({res:G.res});liveApply(G.res)}
function liveClaim(i){G.cl+=(G.cl?',':'')+G.stage+'.'+i;ROOM&&ROOM.presence({cl:G.cl})}
function liveDecide(i,who){if(!G.host)return;const b=curRes(G.stage),j=b[i]==='.'?i:b.indexOf('.');if(j>=0)liveSetRes(G.stage,j,who);else liveApply(G.res)}
function liveTimeout(){if(!G.host)return;const st=G.stage,b=curRes(st);if(!b.includes('.'))return;
  const a=G.res?G.res.split('|'):[];while(a.length<=st)a.push('.'.repeat(K_PER));a[st]=b.replace(/\./g,'-');G.res=a.join('|');ROOM&&ROOM.presence({res:G.res});liveApply(G.res)}
function liveApply(res){
  if(!G||G.done)return;G.res=res;if(!G.pz||G.pzStage!==G.stage)return;
  const st=G.stage,b=curRes(st,res);let changed=false;
  for(let i=0;i<K_PER;i++){const ch=b[i],key=st+'.'+i;if(ch==='.'||G.seen[key])continue;G.seen[key]=1;changed=true;const t=G.pz.T[i];
    if(ch==='-'){t.who='x';continue}
    const mine=(ch==='H')===G.host;
    if(mine){t.who='me';G.me++;toast('+1점','var(--num)',G.pend[key]?'+'+G.pend[key]:'')}
    else{const mineLost=!!G.pend[key];if(mineLost){G.score-=G.pend[key];G.combo=0;t.key=null}t.who='op';G.op++;sLose();buzz(40);toast(esc(G.opNick||'상대')+' 득점','var(--hot)');if(!mineLost)flashOp(t.sol)}
    delete G.pend[key]}
  if(!changed)return;
  renderHud();if(!T.fl)renderPath();
  if(G.endAt===st)return;
  if(G.me>=G.goal||G.op>=G.goal){G.endAt=st;G.live=false;clearT();freezeFuse();const w=G.me>=G.goal;T.nx=setTimeout(()=>liveEnd(w),1400);return}
  if(!b.includes('.')){G.endAt=st;G.live=false;clearT();freezeFuse();
    const miss=G.pz.T.filter(t=>t.who==='x');if(miss.length){toast('시간 끝','var(--fg)');showOpPath(miss[0].sol,'아무도 못 찾은 목표 '+miss.map(t=>t.v).join(', '),miss[0].v)}
    T.nx=setTimeout(()=>{if(!G||G.done)return;G.stage++;nextPuzzle()},1500)}
}

$('gBack').onclick=askQuit;
function askQuit(){
  if(!G||G.done)return goHome();
  if(G.mode==='live'){modal('<h2>대결에서 나갈까요?</h2><p class="c">'+(G.ranked?'랭크전에서 나가면 진 걸로 쳐요.':'상대에게 내가 나갔다고 보여요.')+'</p><div class="row"><button class="btn pri" id="qNo">계속하기</button><button class="btn" id="qYes">나가기</button></div>');
    $('qNo').onclick=closeModal;$('qYes').onclick=()=>{closeModal();if(G.ranked&&G.started){leaveRoom();G.op=G.goal;finish(false)}else goHome()};return}
  const was=pauseG();G.held=1;
  modal('<h2>그만할까요?</h2><p class="c">이번 판 기록은 남지 않아요.</p><div class="row"><button class="btn pri" id="qNo">계속하기</button><button class="btn" id="qYes">그만하기</button></div>');
  $('qYes').onclick=()=>{closeModal();goHome()};
  $('qNo').onclick=()=>{closeModal();G.held=0;resume(was)};
}
function resume(was){if(!G)return;if(!was){afterRound();return}
  G.live=true;const now=performance.now();
  if(G.pz0){G.t0+=now-G.pz0;G.pz0=0}
  if(G.dur){const left=G.left!=null?G.left:Math.max(0,G.end-now);G.left=null;G.end=now+left;runFuse(left,G.dur);T.end=setTimeout(timeUp,left)}
  if(G.mode==='vs'&&G.aiLeft!=null){const l=G.aiLeft;G.aiLeft=null;G.aiEnd=now+l;runFuse(l,G.aiDur);T.ai=setTimeout(aiClaim,l)}}
window.__appBack=function(){
  if(!$('ov').hidden){const x=$('ovc').querySelector('#sOk,#rOk,#qNo,#mmX,#fX,#fCancel,#noB,#naN,#wN,#nNo,#tHome,#rHome,#rvNo,#mmB,#byN,#pGo');if(x){x.click();return true}return true}
  if(!$('game').hidden){askQuit();return true}
  if(curTab!=='Play'){tab('Play');return true}
  return false;
};
/* heat: stop timers + sound when the app is hidden (live matches keep running: the other player is waiting) */

function kPick(cat){const L=KL[cat];if(!L)return null;let bag=(P.kb[cat]||[]).filter(i=>i<L.length);if(!bag.length){bag=L.map((_,i)=>i);for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}

function homeLine(){

  if(P.lastOpen!==k){P.lastOpen=k;save();return say(days>=3?'back':'hi',null,1)}
  const c=[];if(!P.day[k])c.push('day');if(P.beaten<5)c.push('ai');if(P.best)c.push('inf');c.push('tap');
  say(c[Math.floor(Math.random()*c.length)],null,1)}

/* 게임 장면에 별콩이 말 붙이기 */
const _begin=begin;begin=function(pz,dur){const first=G&&(G.solved===0&&!G.saidStart);const r=_begin.apply(this,arguments);
  if(first&&G.mode!=='tut'&&G.mode!=='demo'){G.saidStart=1;say(G.mode==='live'?'startLive':'start')}else kongFace('think');return r};
const _solved=solved;solved=function(){const m=G.mode;const r=_solved.apply(this,arguments);
  if(!G||m==='tut'||G.done)return r;
  if(m==='live'){kongFace('happy');return r}
  const frac=G.lastFrac||0;
  if(m==='vs'&&G.combo%3===0)say('freeze');else if(G.combo>=3)say('combo',{c:G.combo});else if(frac>.7)say('fast');else say('solve');return r};
const _aiClaim=aiClaim;aiClaim=function(){const op=G&&G.op;const r=_aiClaim.apply(this,arguments);if(G&&G.op>op&&!G.done)say('opScore');return r};
const _timeUp=timeUp;timeUp=function(){const m=G&&G.mode;const r=_timeUp.apply(this,arguments);
  if(G&&m!=='live'&&!G.live)say('timeout');return r};
const _liveApply=liveApply;liveApply=function(res){const before=G.op;const r=_liveApply.apply(this,arguments);if(G&&G.op>before)say('opLive');return r};

const _finish=finish;finish=function(win){
  const m=G.mode,lv0=lvOf(P.xp).lv,best0=P.best;let c=Math.max(1,Math.round(G.score/150));
  if(m==='vs'&&win)c+=3+G.lv*2;if(m==='live'&&win)c+=G.ranked?8:4;if(m==='day'&&!P.day[G.key])c+=5;if(m==='tut'||m==='iq')c=0;
  P.coins+=c;
  const r=_finish.apply(this,arguments);
  try{const kv=$('ovc').querySelector('.kv');if(kv&&c)kv.insertAdjacentHTML('beforeend','<span>얻은 별</span><b>★'+c+' (가진 별 ★'+P.coins+')</b>')}catch(e){}
  save();
  const lv1=lvOf(P.xp).lv;
  setTimeout(()=>{if(lv1>lv0)say('lvup',null,1);else if(m==='inf'&&P.best>best0)say('best',null,1);else say(win?'win':'lose',null,1)},50);
  return r};

function decoSvg(id,i){const r=(9+(i*7)%9);
  if(id==='snow')return '<svg width="'+r*2+'" height="'+r*2+'" viewBox="-10 -10 20 20"><g stroke="#ffffff" stroke-opacity=".75" stroke-width="1.6" stroke-linecap="round"><line x1="-9" y1="0" x2="9" y2="0"/><line x1="-4.5" y1="-7.8" x2="4.5" y2="7.8"/><line x1="-4.5" y1="7.8" x2="4.5" y2="-7.8"/></g></svg>';
  if(id==='petals')return '<svg width="'+r*2+'" height="'+r*2+'" viewBox="-10 -10 20 20"><path d="M0 -8 C6 -6 7 3 0 8 C-7 3 -6 -6 0 -8Z" fill="#ff9ec4" fill-opacity=".8" transform="rotate('+(i*47%360)+')"/></svg>';
  if(id==='stars'){const p=[];for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,d=k%2?r*.45:r;p.push((r+Math.cos(a)*d).toFixed(1)+','+(r+Math.sin(a)*d).toFixed(1))}return '<svg width="'+r*2+'" height="'+r*2+'"><polygon points="'+p.join(' ')+'" fill="#ffd166" fill-opacity=".85"/></svg>'}
  return ''}
function decoDraw(){const el=$('deco');if(!el)return;const id=P.deco;if(!id||!(UNLOCK()||P.decoOwn[id])){el.innerHTML='';return}
  if(id==='lights'){const cols=['#ff6b6b','#ffd166','#5ee6a0','#6ee7f9','#c9a7ff'];let s='<svg width="100%" height="40" viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M0 6 Q50 30 100 8 T200 8 T300 8 T400 6" stroke="#5a5f8a" stroke-width="1.5" fill="none"/>';
    for(let i=0;i<16;i++){const x=12+i*25,y=8+Math.abs(Math.sin(i*0.79))*16;s+='<ellipse cx="'+x+'" cy="'+(y+5)+'" rx="4" ry="6" fill="'+cols[i%5]+'"/>'}el.innerHTML=s+'</svg>';return}
  let h='';for(let i=0;i<14;i++){const x=(i*37+11)%100,y=i<7?(i*13)%9:91+(i*7)%7;h+='<span style="left:'+x+'%;top:'+y+'%">'+decoSvg(id,i)+'</span>'}el.innerHTML=h}

function buy(name,price,onBuy){
  const can=P.coins>=price;
  modal('<h2>'+name+'</h2><p class="c big" style="font-size:34px">★'+price+'</p><p class="c mut">가진 별 ★'+P.coins+(can?'':' · '+(price-P.coins)+'개 더 모으면 살 수 있어요')+'</p><div class="row"><button class="btn pri" id="byY" '+(can?'':'disabled')+'>사기</button><button class="btn" id="byN">닫기</button></div>');
  $('byN').onclick=closeModal;$('byY').onclick=()=>{if(P.coins<price)return;P.coins-=price;onBuy();save();closeModal();sBig();note(name+' 샀어요!');renderMe()}}

/* ---- 별자리 퍼즐 따라 보기: 새싹방 1단계 판 ---- */
function starDemo(then){
  const r=NF_ROOMS[0],B=nfBoard('sprout',1,0);
  const base=()=>{S={r,B,N:B.n,lv:1,demo:1,val:B.dig.map((v,i)=>B.given[i]!=null?B.given[i]:0),segOf:{},memo:{},hintCell:{},sel:-1,hist:[],memoMode:false,mist:0,hints:1,undos:1,lit:new Set(),wrong:{},why:null,score:0,scored:{},won:false,over:false,revived:0,newly:[]};
    B.stars.forEach(c=>S.val[c]=0);B.segs.forEach((s,k)=>s.cells.forEach(c=>S.segOf[c]=k));B.segs.forEach((s,k)=>{if(nfSegOk(k))S.lit.add(k)})};
  base();show('star');nfLayout();nfDraw();$('nfMode').textContent='별자리 퍼즐 · 따라 보기';$('kongC').dataset.who='';
  const k0=B.segs.findIndex(s=>s.cells.some(c=>nfBlank(c))),seg=B.segs[k0],blanks=seg.cells.filter(c=>nfBlank(c));
  /* 같은 줄 숫자 예: 다른 구간 빈칸 j에, 같은 가로·세로줄에 이미 있는 숫자 */
  let cj=-1,cd=0;const N=B.n;
  for(let j=0;j<N*N&&cj<0;j++){if(!nfBlank(j)||seg.cells.includes(j))continue;const r0=(j/N)|0,c0=j%N;
    for(let k=0;k<N;k++){const v=B.given[r0*N+k]!=null?B.given[r0*N+k]:B.given[k*N+c0];if(v&&v!==B.dig[j]){cj=j;cd=v;break}}}
  const fill=()=>{blanks.forEach(c=>S.val[c]=B.dig[c]);S.lit=new Set();B.segs.forEach((s,k)=>{if(nfSegOk(k))S.lit.add(k)})};
  const redraw=()=>{nfDraw();$('nfMode').textContent='별자리 퍼즐 · 따라 보기'};
  coStart([
    {t:'이번엔 <b>별자리 퍼즐</b>(별잇기)이에요. <b>길은 미리 그려져 있어요.</b> 작은 점에서 출발해 선을 따라 별까지 가요.',ex:'happy',spot:'nfBoard',run:()=>{base();redraw()}},
    {t:'빈 동그라미를 누르면 그 칸이 가는 길이 위에 크게 보여요. <b>앞 별부터 이 별까지 숫자를 더하면 별 숫자</b>가 돼야 해요.',ex:'think',spot:'nfZoom',run:()=>{base();S.sel=blanks[0];redraw()}},
    {t:'칸을 고르고 <b>아래 숫자</b>를 누르면 들어가요. 합이 맞으면 금빛 선이 그려지고 <b style="color:var(--num)">별이 반짝 켜져요!</b>',ex:'excited',spot:'nfPad',run:()=>{base();S.sel=blanks[0];redraw();
      blanks.forEach((c,k)=>coAt(700+k*800,()=>{S.sel=c;S.val[c]=B.dig[c];sTap();const pad=$('nfPad').children[B.dig[c]-1];pad&&pad.classList.add('spot');coAt(350,()=>pad&&pad.classList.remove('spot'));
        if(k===blanks.length-1){S.newly=[k0];S.lit.add(k0);sWin()}redraw();S.newly=[]}))}},
    {t:'스도쿠처럼 <b>가로줄·세로줄에 같은 숫자</b>는 못 써요. 틀리면 빨갛게 되고 <b style="color:var(--hot)">하트 ♥</b>가 하나 줄어요. 하트는 3개예요.',ex:'worry',spot:'nfZoom',run:()=>{base();fill();redraw();
      if(cj>=0)coAt(600,()=>{S.sel=cj;S.val[cj]=cd;S.wrong[cj]=1;S.why={i:cj,t:nfWhy(cj,cd)};sLose();redraw();$('nfHp').innerHTML='♥♥<span style="opacity:.3">♥</span>'})}},
    {t:'헷갈리면 <b>✏ 메모</b>로 후보를 적고, 막히면 <b>💡 힌트</b>! 모든 별이 켜지면 <b style="color:var(--num)">별자리 완성</b>이에요. 시간 제한은 없어요.',ex:'love',spot:()=>document.querySelector('.nf-tools'),btn:'직접 해 보기',run:()=>{base();fill();redraw()}}
  ],
  ()=>{P.nfDemo=1;P.nfSeen=1;save();S=null;then?then():nfStart('sprout')},()=>{P.nfDemo=1;P.nfSeen=1;save();S=null;goHome()});
}
